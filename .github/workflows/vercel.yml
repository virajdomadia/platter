# Build on GitHub's runner and upload the finished output to Vercel, so Vercel spends no build minutes.
# The project is connected to this repo with Root Directory `web`; web/vercel.json and the project
# setting skip Vercel's own Git builds, so this workflow is the only production deploy.
# Needs repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# The api (project platter-api, Root Directory `api`, secret VERCEL_PROJECT_ID_API) is created and
# skips Vercel builds too; add an `api` job here, before `web`, once api/ has code (see frontrow).
name: vercel
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: vercel-production, cancel-in-progress: false }
permissions: { contents: read }
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: npm install --global vercel@52.2.1
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        # retries any failure, incl. a brief 404 while the domain switches to the new deployment
        run: curl --fail --silent --show-error --max-time 30 --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null https://platter.virajdomadia.com/
