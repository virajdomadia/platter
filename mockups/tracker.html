-->|search / reverse| PH\n  API -->|create order · refund v2| RZ\n  RZ -->|payment webhooks| API\n  API -->|photos| BL --> CU\n  API -->|revalidate tags| WEB\n  API -->|notifications v2| WP\n```\n\n## 2. Boundaries\n| Component | Owns | Never does |\n|---|---|---|\n| **web/** | Every screen; MapLibre maps, the gliding marker and route draw; `EventSource` reducers; the rider's GPS uplink (`watchPosition` → POST); the Razorpay modal; the PWA shell | Touch the DB, OSRM, Photon or Razorpay's server API; compute ETAs or distances that matter; decide who is nearest; trust a client total |\n| **api/** | Auth and RBAC, the state machine (`transition()`), dispatch (`assign_rider`, offers v2, batching v3), the simulation clock, the stream loop, geo queries, routing + ETA, quotes / orders / `mark_paid` / webhooks, ledger (v2), seed | Hold WebSockets; run a background process; serve tiles; store lat/lng as floats outside PostGIS |\n| **Postgres + PostGIS** | Everything durable and every spatial question (within radius, nearest, along-route); `order_events` as the bus; `LISTEN/NOTIFY` in v3 | Store photos |\n| **Blob** | Bytes: dish photos, covers | Anything else |\n| **OpenFreeMap / OSRM / Photon** | Tiles, one route per leg, address text | Anything the app depends on being up — every call has a fallback |\n| **Razorpay** | Taking the money and telling us via webhook | Deciding when an order is `placed` — `mark_paid` is ours |\n\nContract: `api/openapi.json` → `web/src/lib/api-types.ts` via `pnpm gen:api`. Web client (`web/src/lib/api.ts`) = typed `fetch` forwarding cookies, trusting only the `{ error: { code, message, details } }` envelope. Stream payloads are typed in `web/src/lib/stream-types.ts`, hand-written from 06 §D.\n\n## 3. api/ layout\n```\napi/app/\n  main.py            app factory, request-id middleware, error envelope\n  config.py          pydantic-settings\n  db.py              async engine (pooled) · direct engine for LISTEN (v3)\n  models/            user, session, restaurant, menu_category, menu_item, address, rider, rider_position, rider_track,\n                     order, order_item, order_event, rider_leg, webhook_event,\n                     offer · push_subscription · rating · refund · ledger_entry · payout (v2), prep_stat · eta_log (v3), group · group_item · group_event (v4)\n  schemas/           pydantic request/response models (= the OpenAPI contract) · stream event payloads\n  routers/           auth, geo (search, reverse), restaurants (list, page), orders (quote, create, verify, get, list, cancel, events),\n                     rider (me, position, job, transition, events), restaurant (board, transition, menu availability, events),\n                     admin (map, orders, reassign, riders, events), webhooks,\n                     offers · push · menu · ratings · earnings · payouts (v2), heatmap (v3), groups (v4)\n  services/\n    orders.py        quote(), create(), TRANSITIONS, transition(), mark_paid(), expire_stale()\n    dispatch.py      assign_rider(), release_rider(), on_rider_available(), reassign(); offer() (v2); try_stack() (v3)\n    sim.py           advance_simulation(), position_on_leg(), sim_tick_positions()\n    stream.py        stream(scope, since) — the SSE generator; scopes: order, restaurant, rider, admin, group (v4)\n    routing.py       route(a, b, waypoints) → OSRM or straight line; decode / length / project helpers\n    eta.py           eta(order, position) → { seconds, method, band (v3) }\n    geo.py           nearby_restaurants(pin), nearest_available_rider(point), photon search / reverse\n    razorpay.py      order create, signature verify, webhook verify, refund (v2)\n    ledger.py        post_delivery(), balance() (v2)\n    push.py          send(user, payload) (v2)\n    prep_model.py    learned prep + rider speed (v3)\n  seed/              area.json (restaurants, items, riders, junctions) · fetch_photos.py · photos/ (+ CREDITS.md) · seed.py (idempotent; two live orders)\nscripts/             measure_latency.py (v3) · gen_vapid.py (v2)\ntests/               the tests listed in 04 §12 only\n.github/workflows/   ci.yml\n```\n\n## 4. web/ layout\n```\nweb/src/\n  app/(site)/            page.tsx (home) · r/[slug] · checkout · orders · orders/[id] · addresses · sign-in · sign-up · o/[code] (v4)\n  app/(restaurant)/restaurant/   layout (404 non-restaurant) · page (board) · menu · earnings (v2)\n  app/(rider)/rider/     layout (404 non-rider) · page (the app) · earnings (v2)\n  app/(admin)/admin/     layout (404 non-admin) · page (map) · payouts (v2) · heatmap (v3)\n  app/api/revalidate/    route.ts\n  components/site/       PinHeader · AddressSearch · RestaurantCard · RestaurantList · Menu · MenuItem · CartSheet · CheckoutForm · RazorpayButton · OrderCard\n  components/map/        Map (MapLibre) · RiderMarker · RouteLayer · TrailLayer · PinMarker · RestaurantMarker\n  components/tracking/   StatusRail · EtaBadge · OrderSummary · RiderCard · GroupMembers (v4)\n  components/board/      TicketColumn · Ticket · TodayStats · AvailabilityList\n  components/rider/      JobCard · ShareLocationToggle · BigButtons · OfferCard (v2) · BusyAreaHint (v3)\n  components/admin/      LiveMap · OrdersTable · ReassignPicker · Heatmap (v3)\n  components/landing/    (exists)\n  components/ui/\n  lib/api.ts · api-types.ts (generated) · stream.ts (useOrderStream / useRestaurantStream / useRiderStream / useAdminStream / useGroupStream) · stream-types.ts · geo.ts (polyline decode, haversine, bearing) · geoUplink.ts · cart.ts · money.ts · session.ts\n  public/manifest.webmanifest · sw.js · map-dark.json\n```\n\n## 5. Deployment topology\n- Two Vercel projects per repo: `platter` (root `web/`) and `platter-api` (root `api/`, FastAPI preset, `bom1`, `maxDuration: 300` in `vercel.json`). `web/next.config.ts` rewrites `/api/:path*` → `API_URL`; cookies are first-party; `EventSource` is same-origin; no CORS.\n- Neon: one project with PostGIS enabled; `main` = production, a `dev` branch for local; `DATABASE_DIRECT_URL` (unpooled) only for the v3 listener. CI uses `postgis/postgis:17-3.5`.\n- Blob store on `platter-api`; `NEXT_PUBLIC_BLOB_HOST` in `remotePatterns`.\n- Razorpay test mode; webhook → `https://platter.virajdomadia.com/api/webhooks/razorpay` (via the web rewrite).\n- OpenFreeMap, OSRM public and Photon need no account; the API sends a `User-Agent: platter.virajdomadia.com` and rate-limits Photon at 10/min/IP.\n- Previews: Vercel previews per PR for `web/` against the production API.\n- CI: `web` = pnpm typecheck + build; `api` = ruff + pytest. That is all.\n\n## 6. Request paths worth drawing\n**Order:** pin at Koramangala 5th Block → `GET /api/restaurants?lat&lng` (PostGIS, 9 within 5 km) → `/r/dosa-camp` → cart → `POST /api/orders/quote` → `POST /api/orders { cod }` → `placed` + event → `/orders/PL-1042` opens `EventSource` → prime `status` → the board's stream ticks and prints the ticket.\n**Accept → rider:** board `POST /api/restaurant/orders/{id}/transition { to: accepted }` → `transition()` → `assign_rider()` KNN → sim rider 4 (`busy`), OSRM leg 1.3 km / 4 min → events `accepted`, `rider_assigned`, `route` → the customer stream draws the route and the marker starts gliding; the rider stream (a real rider) shows the job card.\n**Ready → delivered (sim):** board marks `ready`; the sim is already waiting (`arrived_at`) → `picked_up` + leg *to_customer* (2.1 km / 7 min) → each tick computes the position, ETA falls → at progress 1 → `delivered` → rider `available` → `on_rider_available` finds nothing → idle at the drop.\n**Real rider:** phone toggles *Share my location* → `watchPosition` → `POST /api/rider/position` every 3 s → upsert + track → the customer's next tick (≤ 1 s) emits `rider` → the marker interpolates to it over the next fixes' gap.\n**Reconnect:** the stream closes at 280 s → the browser reconnects with `Last-Event-ID: 4312:1758112233000` → the loop replays events > 4312 and positions > that ms → nothing missed.\n**Order together (v4):** host → `POST /api/groups` → `/o/K7Q2M9X4ZP` shared → friend adds a dosa → `group_events` → the host's stream shows it → host checks out → one order with `group_id` → both phones' `/o/{code}` become the tracking page.\n\n## 7. Security notes (the short list)\nCookie session HttpOnly + SameSite=Lax; argon2 passwords; board / rider / admin 404 for the wrong role; every transition checks role + ownership + current status under a row lock; streams authorise the scope at open and on every reconnect; a customer stream never carries other orders' events; rider positions are accepted only from the rider's own session and only exposed on streams of orders they are assigned to (the admin sees all); prices and fees come from the DB and OSRM, never the client; Razorpay signatures verified on verify and webhooks, event ids deduped; Photon / OSRM calls go through the API with rate limits and a UA, never from the browser directly; group codes (v4) are 50-bit random capability URLs, expire 24 h after delivery, and checkout still needs the host's session; no PII in logs (positions are logged only as rows in `rider_track`, pruned 7 days after delivery).\n"}, {"name": "06-data-and-api", "path": "docs/06-data-and-api.md", "md": "# Platter — Database + API Design\n\n**Lifecycle step:** 6 of 17 · **Locked:** 2026-09-17 · Behaviour in [04-technical-design.md](04-technical-design.md). Alembic `0001_v1` creates everything under **A** (after `create extension if not exists postgis`); v2 / v3 / v4 tables get their own migrations.\n\n## A. Postgres schema (v1)\n\n```sql\ncreate extension if not exists postgis;\n\ncreate type user_role     as enum ('customer','restaurant','rider','admin');\ncreate type rider_status  as enum ('offline','available','busy');\ncreate type order_status  as enum ('pending_payment','placed','accepted','preparing','ready','picked_up','delivered','rejected','cancelled','expired');\ncreate type payment_kind  as enum ('cod','razorpay');\ncreate type leg_kind      as enum ('to_restaurant','to_customer');\ncreate type route_method  as enum ('osrm','line');\n\nusers            (id uuid pk, email citext unique, password_hash text, name text, phone text null, role user_role default 'customer', created_at)\nsessions         (id text pk, user_id uuid fk, expires_at timestamptz, created_at)                         index (user_id)\naddresses        (id uuid pk, user_id fk, label text, line text, loc geography(point,4326), created_at)   index (user_id)\n\nrestaurants      (id uuid pk, owner_user_id uuid fk unique, slug citext unique, name text, area text, cuisines text[],\n                  is_veg bool default false, loc geography(point,4326), address text, prep_min int default 15,\n                  hours jsonb,                       -- {mon: [[\"11:00\",\"23:00\"]], …}\n                  is_open bool default true, cover_url text null, rating numeric(2,1) null, created_at)\n                  index gist (loc) · index (slug)\nmenu_categories  (id uuid pk, restaurant_id fk, name text, sort int)                                       index (restaurant_id, sort)\nmenu_items       (id uuid pk, restaurant_id fk, category_id fk, name text, description text null,\n                  price_paise int check (price_paise > 0), is_veg bool, photo_url text null,\n                  is_available bool default true, sort int)                                                index (restaurant_id, category_id, sort)\n\nriders           (id uuid pk, user_id uuid fk unique, name text, phone text, vehicle text,               -- 'scooter' | 'cycle'\n                  is_sim bool default false, status rider_status default 'available', speed_kmh numeric(4,1) default 22.0, created_at)\n                  index (status)\nrider_positions  (rider_id uuid pk fk, loc geography(point,4326), heading smallint null, speed_mps numeric(5,2) null,\n                  recorded_at timestamptz,                        -- server now(): the cursors and staleness checks use this\n                  client_at timestamptz null)                     -- the phone's own clock, only to drop out-of-order fixes\n                  index gist (loc)\nrider_track      (id bigserial pk, order_id uuid fk, rider_id fk, at timestamptz, loc geography(point,4326))   index (order_id, at)\n\norders           (id uuid pk, number text unique,                     -- 'PL-1042', sequence-backed\n                  user_id fk, restaurant_id fk, rider_id uuid fk null,\n                  status order_status, payment payment_kind,\n                  address_line text, drop_loc geography(point,4326),  -- snapshot\n                  subtotal_paise int, delivery_fee_paise int, platform_fee_paise int, total_paise int,\n                  distance_m int, route_method route_method, eta_s int null, note text null,\n                  razorpay_order_id text unique null, razorpay_payment_id text null,\n                  created_at, placed_at null, accepted_at null, preparing_at null, ready_at null,\n                  picked_up_at null, delivered_at null, rejected_at null, cancelled_at null, expired_at null, reject_reason text null,\n                  group_id uuid null (v4), stack_seq smallint null (v3))\n                  index (user_id, created_at desc) · index (restaurant_id, status) · index (rider_id) where rider_id is not null ·\n                  index (status, accepted_at) where rider_id is null\norder_items      (id uuid pk, order_id fk, menu_item_id fk null, name text, price_paise int, qty int, is_veg bool, member_name text null (v4))  index (order_id)\norder_events     (seq bigserial pk, order_id fk, kind text, actor_role text, actor_id uuid null, payload jsonb, at timestamptz default now())\n                  index (order_id, seq) · index (seq)\nrider_legs       (id uuid pk, order_id fk, rider_id fk, kind leg_kind, polyline text, distance_m int, duration_s int,\n                  method route_method, started_at timestamptz, arrived_at null, ended_at null, stops jsonb null (v3))\n                  index (rider_id) where ended_at is null · index (order_id)\nwebhook_events   (id text pk, event text, received_at)\n```\n\n`order_events` is append-only and is the bus; its `seq` is **commit-ordered** because every insert takes `pg_advisory_xact_lock(1)` first (04 §3), so a stream cursor `seq > $last` never skips an event. `kind ∈ placed | accepted | rejected | cancelled | preparing | ready | picked_up | delivered | expired | rider_assigned | rider_reassigned | route | note` (v2 adds `offer_sent | offer_declined | offer_expired | refunded`, v3 `stacked`); `payload` carries what the event needs (`route`: polyline + distance + duration + kind; `rider_assigned`: name + vehicle). `rider_positions` holds one row per rider (latest); `rider_track` is the trail for the order's map and the case study, pruned 7 days after `delivered`. `orders.drop_loc` and `address_line` are snapshots. Every `*_at` is set by its transition. Money is integer paise; `distance_m` is the OSRM (or straight × 1.3) restaurant → drop distance at quote time.\n\n**transition recipe** (every actor, every edge):\n```sql\nbegin;\n  select * from orders where id = $1 for update;\n  -- TRANSITIONS[(status, $to)] → roles + guard; not allowed → rollback, 409 illegal_transition {from, to}\n  update orders set status = $to, <to>_at = now() where id = $1;\n  select pg_advisory_xact_lock(1);                                          -- commit-ordered seq (taken after every row lock)\n  insert into order_events (order_id, kind, actor_role, actor_id, payload) values ($1, $to, $role, $actor, $payload);\n  -- side effects in the same transaction: accepted → assign_rider · ready → sim pickup if arrived ·\n  -- picked_up → new leg · delivered → release_rider + on_rider_available (+ ledger v2)\ncommit;\n```\n\n**nearest available rider** (inside `assign_rider`):\n```sql\nselect r.id from riders r join rider_positions p on p.rider_id = r.id\nwhere r.status = 'available'\norder by p.loc <-> (select loc from restaurants where id = $restaurant) limit 1\nfor update of r skip locked;\n```\n\n**nearby restaurants:**\n```sql\nselect r.*, ST_Distance(r.loc, ST_MakePoint($lng, $lat)::geography)::int as distance_m\nfrom restaurants r\nwhere ST_DWithin(r.loc, ST_MakePoint($lng, $lat)::geography, 8000)\norder by distance_m;   -- ≤ 5000 orderable, 5000–8000 \"Too far\"\n```\n\n**stream read per tick** (order scope):\n```sql\nselect * from order_events where order_id = $o and seq > $seq order by seq;\nselect loc, heading, speed_mps, recorded_at from rider_positions where rider_id = $rider and recorded_at > to_timestamp($pos_ms / 1000.0);\n-- sim riders: position computed from rider_legs (polyline, started_at, duration_s) — no read\n```\n\n**v2 additions:** `offers (id, order_id fk, rider_id fk, state text sent|accepted|declined|expired, expires_at, created_at)` unique (order_id, rider_id) · index (rider_id, state); `push_subscriptions (id, user_id fk, endpoint text unique, p256dh text, auth text, created_at)`; `ratings (id, order_id fk unique, restaurant_stars smallint, rider_stars smallint, line text null, created_at)`; `refunds (id, order_id fk unique, razorpay_refund_id text, amount_paise int, created_at)`; `ledger_entries (id, account text — 'platform' | 'restaurant:{id}' | 'rider:{id}', kind text sale|fee|delivery|delivery_margin|payout, amount_paise int signed, order_id fk null, payout_id uuid null, created_at)` index (account, created_at); `payouts (id, account text, amount_paise int, reference text, paid_by fk, paid_at)`; `restaurants.search tsvector` (name A, cuisines B, item names C via trigger) + GIN; `riders.online_since`.\n**v3 additions:** `prep_stats (restaurant_id pk, median_s int, p80_s int, sample int, updated_at)`; `riders.median_speed_mps`; `eta_log (order_id fk, at, eta_s, actual_s null, method, phase text)`; `orders.stack_seq`; `rider_legs.stops`; trigger `notify_platter` on `order_events` and `rider_positions` → `pg_notify('platter', order_id / rider_id)`.\n**v4 additions:** `groups (id, code text unique, host_user_id fk, restaurant_id fk, address_line, drop_loc, status text open|checked_out, order_id fk null, created_at, expires_at)`; `group_items (id, group_id fk, menu_item_id fk, member_name text, qty int, created_at)` index (group_id); `group_events (seq bigserial, group_id fk, kind text item_added|item_removed|checked_out, payload jsonb, at)` index (group_id, seq).\n\n## B. Blob keys\n| Prefix | Written by | Deleted when |\n|---|---|---|\n| `dishes/{restaurant_slug}/{item_id}.jpg` | Seed (`fetch_photos.py`) · v2 menu editor (client token, ≤ 5 MB) | Item deleted / photo replaced |\n| `covers/{restaurant_slug}.jpg` | Seed · v2 restaurant details | Replaced |\n\n## C. REST API (`/api/*` from the browser; FastAPI serves `/docs`)\n\nError envelope everywhere: `{ \"error\": { \"code\": \"illegal_transition\", \"message\": \"…\", \"details\": {…} } }`. Auth via cookie; `🔒` = signed in, `🍽` = restaurant owner (404 otherwise, own restaurant only), `🛵` = rider (404), `👑` = admin (404), `📡` = SSE stream (`text/event-stream`). Money fields are paise integers; points are `{ lat, lng }`.\n\n### Auth\n| Method | Path | Body → Returns |\n|---|---|---|\n| POST | `/auth/sign-up` | `{ email, password, name, phone? }` → `Me` |\n| POST | `/auth/sign-in` | `{ email, password }` → `Me` |\n| POST | `/auth/sign-out` | → 204 |\n| GET | `/auth/me` | `Me { id, name, email, role, restaurant?: { id, slug, name }, rider?: { id, name, status } }` · 401 |\n| POST | `/auth/demo` | `{ as: 'customer' \\| 'restaurant' \\| 'rider' \\| 'admin' }` → `Me` |\n\n### Geo & discovery (public)\n| Method | Path | Returns |\n|---|---|---|\n| GET | `/geo/search?q=&lat=&lng=` | `Place[] { label, line, lat, lng }` (Photon, bbox Bengaluru, 10/min/IP) |\n| GET | `/geo/reverse?lat=&lng=` | `Place` |\n| GET | `/restaurants?lat=&lng=&q= (v2)&cuisine= (v2)&veg= (v2)&sort= (v2)` | `RestaurantCard[]` — within 8 km, `orderable` = ≤ 5 km and open; `distance_m`, `eta_s`, `delivery_fee_paise` for the pin · `private, max-age=30` |\n| GET | `/restaurants/{slug}?lat=&lng=` | `Restaurant` (info + `categories → items` with `is_available`; distance / fee for the pin when given) · 404 |\n\n### Customer 🔒\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET/POST/DELETE | `/addresses` · `/addresses/{id}` | `{ label, line, lat, lng }` → `Address` |\n| POST | `/orders/quote` | `{ restaurant_id, items: [{ id, qty }], address: { lat, lng } }` → `Quote { items: QuoteItem[], subtotal_paise, delivery_fee_paise, platform_fee_paise, total_paise, distance_m, eta_s }` · 422 `item_unavailable { ids }` / `out_of_range` / `restaurant_closed` |\n| POST | `/orders` | `Quote request + { address_line, address_id?, payment: 'cod' \\| 'razorpay', note? }` → `OrderStart { order: Order, razorpay?: { order_id, key_id, amount_paise } }` |\n| POST | `/orders/{id}/verify` | `{ razorpay_payment_id, razorpay_signature }` → `Order` · 400 `bad_signature` |\n| GET | `/orders` | `OrderCard[]` (own) |\n| GET | `/orders/{id}` | `Order` (items, status, timestamps, rider `{ name, vehicle }?`, legs, eta, events) — own only · 404 |\n| POST | `/orders/{id}/cancel` | → `Order` · 409 unless `placed` |\n| GET 📡 | `/orders/{id}/events` | SSE — see **D** · 403 not owner |\n\n### Restaurant 🍽\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET | `/restaurant/board` | `Board { new: Ticket[], cooking: Ticket[], ready: Ticket[], out: Ticket[], today: { orders, revenue_paise, avg_accept_s } }` |\n| POST | `/restaurant/orders/{id}/transition` | `{ to: 'accepted' \\| 'rejected' \\| 'preparing' \\| 'ready', reason? }` → `Ticket` · 409 `illegal_transition` |\n| GET/PATCH | `/restaurant/menu` · `/restaurant/items/{id}` | v1: `{ is_available }` only → `MenuItem` |\n| GET 📡 | `/restaurant/events` | SSE — order events for this restaurant + rider distance while *to_restaurant* |\n\n### Rider 🛵\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET | `/rider/me` | `RiderMe { rider, job?: Job { order, leg, restaurant, drop, items_count, pay_preview_paise }, today: { deliveries, pay_paise } }` |\n| POST | `/rider/position` | `{ lat, lng, heading?, speed_mps?, at }` → 204; `recorded_at` is server time, `at` only orders fixes from the same phone (older `at` → 204 `X-Ignored: stale`; > 200 m within 3 s → 204 `X-Ignored: jump`, dropped) |\n| POST | `/rider/orders/{id}/transition` | `{ to: 'picked_up' \\| 'delivered' }` → `Job \\| null` · 409 |\n| GET 📡 | `/rider/events` | SSE — `assigned`, `status`, `route`, `offer` (v2) |\n\n### Admin 👑\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET | `/admin/map` | `{ orders: AdminOrder[] (active, with rider, legs, stuck?: string), riders: AdminRider[] (position, status, is_sim, current_order?), today: { orders, delivered, revenue_paise, avg_delivery_s } }` |\n| GET | `/admin/orders?status=&stuck=` | `AdminOrder[]` |\n| GET | `/admin/riders?near=lat,lng` | `AdminRider[]` sorted by distance (for the reassign picker) |\n| POST | `/admin/orders/{id}/reassign` | `{ rider_id }` → `AdminOrder` · 409 if the rider is busy / the order is not assignable |\n| GET 📡 | `/admin/events` | SSE — every order event + `riders` snapshot every 2 s |\n\n### Server-to-server\n| Method | Path | Notes |\n|---|---|---|\n| POST | `/webhooks/razorpay` | `X-Razorpay-Signature` HMAC over the raw body; `webhook_events.id` unique; `payment.captured → mark_paid`, `payment.failed → no-op (stays pending until expiry)` |\n| POST (web) | `{WEB_URL}/api/revalidate` | `{ tags: [], secret }` — on menu / restaurant changes |\n\n### v2\n| Method | Path | Notes |\n|---|---|---|\n| 🛵 | `POST /rider/status { status: 'available' \\| 'offline' }` · `POST /rider/offers/{id}/accept` · `/decline` | offers; 409 `offer_expired` / `offer_taken` |\n| 🔒 | `POST /push/subscribe { endpoint, keys }` · `DELETE /push/subscribe` | VAPID public key at `GET /push/key` |\n| 🍽 | `POST/PATCH/DELETE /restaurant/categories*` · `/restaurant/items*` · `POST /restaurant/items/{id}/photo/token` · `PATCH /restaurant` (hours, is_open, prep_min, cover) | menu editor; Blob client-upload protocol |\n| 🔒 | `POST /orders/{id}/rating { restaurant_stars, rider_stars, line? }` · `POST /orders/{id}/reorder` → `{ cart, dropped: string[] }` | once per order |\n| 🍽 🛵 | `GET /restaurant/earnings` · `GET /rider/earnings` → `Earnings { balance_paise, paid_paise, entries[] }` | |\n| 👑 | `GET /admin/payouts` (balances by account) · `POST /admin/payouts { account, amount_paise, reference }` · `POST /admin/orders/{id}/refund` | |\n\n### v3\n`GET 👑 /admin/heatmap?hour=` → `{ hexes: [{ geojson, count }] }` · `GET 🛵 /rider/hint` → `{ area, centre, count }` · order `eta` events gain `band: [lo, hi]` and `stack: { seq, of }` · `scripts/measure_latency.py` (rider POST → customer event, 50 fixes).\n\n### v4\n`POST 🔒 /groups { restaurant_id, address_line, lat, lng }` → `Group { code, url }` · `GET /groups/{code}` → `GroupView { restaurant, items: GroupItem[] (member_name), totals, status, order_id? }` · `POST /groups/{code}/items { menu_item_id, qty, member_name }` · `DELETE /groups/{code}/items/{id}` (own or host) · `POST 🔒 /groups/{code}/checkout { payment, note? }` (host only → `OrderStart`) · `GET 📡 /groups/{code}/events` (group events, then the order's events after checkout).\n\n## D. Stream events and payload shapes\n```ts\n// SSE frames: id: \"{seq}:{pos_ms}\" · event: <kind> · data: <json>. retry: 1000. \": ping\" every 15 s. \"event: reconnect\" at 280 s.\ntype StatusEvent   = { order_id: string; status: OrderStatus; at: string; reason?: string; rider?: { name: string; vehicle: string } };\ntype RouteEvent    = { order_id: string; kind: 'to_restaurant' | 'to_customer'; polyline: string; distance_m: number; duration_s: number; method: 'osrm' | 'line'; stops?: { order_id: string; eta_s: number }[] };\ntype RiderEvent    = { order_id?: string; rider_id: string; lat: number; lng: number; heading: number | null; speed_mps: number | null; at: string; is_sim?: boolean };\ntype EtaEvent      = { order_id: string; eta_s: number; method: 'osrm' | 'line'; band?: [number, number]; phase: 'cooking' | 'to_restaurant' | 'to_customer' };\ntype OfferEvent    = { offer_id: string; order: Job; expires_at: string };                    // v2, rider stream\ntype RidersEvent   = { riders: AdminRider[] };                                                // admin stream, every 2 s\ntype GroupEvent    = { kind: 'item_added' | 'item_removed' | 'checked_out'; item?: GroupItem; order_id?: string }; // v4\n\ntype RestaurantCard = { id: string; slug: string; name: string; area: string; cuisines: string[]; is_veg: boolean; cover: { url: string; width: number; height: number } | null;\n                        rating: number | null; prep_min: number; distance_m: number; eta_s: number; delivery_fee_paise: number; orderable: boolean; reason?: 'too_far' | 'closed' };\ntype Restaurant  = RestaurantCard & { address: string; hours: Record<string, [string, string][]>; categories: { id: string; name: string; items: MenuItem[] }[] };\ntype MenuItem    = { id: string; name: string; description: string | null; price_paise: number; is_veg: boolean; photo: { url: string; width: number; height: number } | null; is_available: boolean };\ntype Quote       = { items: { id: string; name: string; price_paise: number; qty: number }[]; subtotal_paise: number; delivery_fee_paise: number; platform_fee_paise: number; total_paise: number; distance_m: number; eta_s: number };\ntype Order       = { id: string; number: string; status: OrderStatus; payment: 'cod' | 'razorpay'; restaurant: { slug: string; name: string; lat: number; lng: number }; drop: { line: string; lat: number; lng: number };\n                     items: { name: string; price_paise: number; qty: number; is_veg: boolean; member_name?: string }[]; totals: Omit<Quote, 'items'>;\n                     rider?: { name: string; vehicle: string; phone_masked: string }; legs: RouteEvent[]; eta?: EtaEvent; events: StatusEvent[]; timestamps: Partial<Record<OrderStatus, string>>; group?: { code: string; members: string[] } };\ntype Ticket      = { id: string; number: string; status: OrderStatus; placed_at: string; age_s: number; customer_first_name: string; payment: 'cod' | 'razorpay'; note: string | null;\n                     items: { name: string; qty: number; is_veg: boolean }[]; total_paise: number; rider?: { name: string; distance_m: number; eta_s: number } };\ntype Job         = { order: Order; leg: RouteEvent; phase: 'to_restaurant' | 'waiting' | 'to_customer'; pay_preview_paise: number };\ntype AdminOrder  = Order & { stuck?: 'unaccepted' | 'no_rider' | 'not_picked_up'; rider_id?: string };\ntype AdminRider  = { id: string; name: string; status: 'offline' | 'available' | 'busy'; is_sim: boolean; lat: number; lng: number; heading: number | null; current_order?: string; last_fix_s: number };\ntype Me          = { id: string; name: string; email: string; role: 'customer' | 'restaurant' | 'rider' | 'admin'; restaurant?: { id: string; slug: string; name: string }; rider?: { id: string; name: string; status: string } };\n```\n"}, {"name": "07-plan", "path": "docs/07-plan.md", "md": "# Platter — Development Plan\n\n**Lifecycle step:** 7 of 17 · **Written:** 2026-09-17 · **Inputs:** [03-requirements.md](03-requirements.md), [04-technical-design.md](04-technical-design.md), [06-data-and-api.md](06-data-and-api.md).\n**Tracker:** row status lives at https://claude.ai/artifact/HEHpyrigHuZpBMoECDs4qG (updated per milestone; rebuild the page with `python mockups/tracker-build.py`).\n**Budget:** v1 ≈ 16 h · v2 ≈ 11 h · v3 ≈ 8 h · v4 ≈ 3 h. v1 runs the whole engine — PostGIS, the state machine, dispatch, the simulation and the SSE bus — from milestone 1.0, so v2 adds humans and money, v3 intelligence, v4 a surface; never a second engine. **Cadence:** evenings/weekends; each row = one branch + one PR, squash-merged, and **every PR shows something in the browser**. Milestones end deployed. **Build last** (order 1 → 2 → 4 → 5 → 3 → 6).\n\n**Lean rules in force** (2026-09-15): setup is the minimum to deploy both apps with plain CI; no observability, contract gates, e2e workflows or tracker updates per PR; review findings fixed on the same branch; tests only from 04 §12. Hours saved go to the tracking page, the board's ticket moment and the seed. **Accounts and keys are created just-in-time** — in the row that first needs them, never in a setup batch: **Neon (+ PostGIS) and Vercel Blob in S2; Razorpay in F3; VAPID keys in L2.** OpenFreeMap, OSRM and Photon need no account. Dish photos are CC from Wikimedia Commons, fetched by script in S2.\n\nHow the lifecycle maps: step 8 = milestone 1.0; steps 9–11 and 14–15 cycle inside every row; step 12 is one checklist row at the end of v1; step 13 is the CI file in 1.0; step 16 is skipped unless something breaks; step 17 is a short doc after v3.\n\nColumn key — **Who:** 🟢 customer · 🟠 restaurant · 🔵 rider · 🟣 admin · ⚪ platform / sim. Endpoints from 06 §C; screens from 03-user-flows.\n\n---\n\n## v1 — Kitchen (≈ 16 h)\n\n### Milestone 1.0 — Skeleton + the engine live (≈ 6 h) — step 8\nGoal: both apps deployed, PostGIS answering, a seeded order moving with a simulated rider over SSE, direction chosen.\n\n| # | Part | Who | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|---|\n| S1 | **Direction + tokens** | 🟢 | Direction already chosen (**L · Bento**, [04-ui-mockups.md](04-ui-mockups.md)) → tokens + Nunito in `globals.css`, tile + shadow primitives, themed browser surfaces; landing restyled to Bento | — | 1.5 h | Tokens live; the landing renders as bento tiles with the tile spring |\n| S2 | **API skeleton + PostGIS + auth + seed** | ⚪ | `next.config.ts` rewrite `/api/*`; `lib/api.ts` typed fetch; `pnpm gen:api` | `pyproject` (uv), `main.py`, settings, error envelope, `/health`; models + Alembic `0001_v1` (06 §A, `create extension postgis`); `/auth/*` (argon2, sessions, `pl_session`, `/auth/demo`, four roles, `require_*`); `services/geo.py` (nearby, nearest rider), `/geo/*` (Photon proxy + limit), `GET /restaurants`, `/restaurants/{slug}`; `seed/area.json` — 12 restaurants at real Koramangala / HSR points, ~100 items, 8 sim riders at junctions + the demo rider, demo customer + addresses; `seed/fetch_photos.py` (Commons API, licence filter, backoff, `CREDITS.md`) → Blob; `seed.py` (idempotent); **accounts needed here and no others:** Vercel project `platter-api` (FastAPI preset, bom1, `maxDuration` 300) + Neon with PostGIS (`DATABASE_URL`) + Vercel Blob (`BLOB_READ_WRITE_TOKEN`); `ci.yml` (web typecheck + build · api ruff + pytest with `postgis/postgis`); **tests:** `geo`, `rbac` | 2 h | `api.platter…/docs` opens in prod; `GET /restaurants?lat&lng` for Koramangala 5th Block returns 9 orderable + 3 too far, sorted, in ≤ 150 ms; a customer hitting `/admin/*` gets 404; seed runs twice cleanly; CI green |\n| S3 | **The engine: state machine + dispatch + sim + stream** | ⚪ | `lib/stream.ts` (`useOrderStream`), a bare `/orders/[id]` page that prints events and the rider's lat/lng as they arrive (the map comes in F2) | `services/orders.py` (`TRANSITIONS`, `transition()`, `quote()`, `create()` for COD), `dispatch.py` (`assign_rider`, `release_rider`, `on_rider_available`, `reassign`), `routing.py` (OSRM + fallback, polyline helpers), `sim.py` (`position_on_leg`, `advance_simulation`), `eta.py`, `stream.py` (the generator, `Last-Event-ID`, 280-s close, ping), routes `POST /orders/quote`, `POST /orders` (cod), `GET /orders/{id}`, `GET /orders/{id}/events`, `POST /restaurant/orders/{id}/transition`, `POST /rider/position`, `POST /rider/orders/{id}/transition`; seed adds two live orders in progress; **tests:** `transitions`, `quote_and_order`, `stream`, `sim`, `eta` | 2.5 h | In prod: place a COD order by curl → accept as the restaurant → a sim rider is assigned with an OSRM route → mark ready → the bare page prints a position every second moving along real streets → `delivered` with no human action; kill the connection, reconnect with `Last-Event-ID` → the missed events replay once; tests green |\n\n### Milestone 1.1 — Order and watch (≈ 5 h) 🟢\n| # | Part | Who | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|---|\n| F1 | **Home + restaurant + cart** | 🟢 | S1 home: `PinHeader` (MapLibre mini-map, draggable pin, geolocation), `AddressSearch` (Photon), `RestaurantList` with `RestaurantCard` (cover via `next/image`, distance / ETA / fee, too far / closed states); S2 restaurant page with `Menu`, `MenuItem` (veg mark, availability), `CartSheet` (`lib/cart.ts`, per-restaurant, switch prompt); S11 addresses; **Plate slide** into the cart bar; tile spring on the list | cache headers; `app/api/revalidate` contract; `/addresses*` | 1.5 h | Moving the pin 3 km re-sorts and re-prices the list without a reload; Lighthouse mobile ≥ 90 / 100 / 100 on home and restaurant with no CLS; an unavailable item cannot be added |\n| F2 | **Tracking page — the hero** | 🟢 | S5 `/orders/[id]`: `Map` (MapLibre dynamic import, liberty style), `RouteLayer` (**Route draw**), `RiderMarker` (**Rider glide**: rAF interpolation between fixes, heading), `TrailLayer`, the tile grid with **Tile spring** and colour swaps per state, ETA roll, Steam while cooking, Handover at delivered, `PinMarker` + `RestaurantMarker`, `StatusRail` lit from events, `EtaBadge`, `OrderSummary`, `RiderCard`, cancel while placed, \"Finding a rider\" / \"signal weak\" states; S16 states | `GET /orders`, `POST /orders/{id}/cancel`; `rider_track` in the stream prime; ETA recompute rules | 2 h | Watching a seeded live order: the route draws, the marker glides along Koramangala's streets, the ETA falls, the rail lights step by step, delivered lands without a refresh; reduced motion: jumps and no draw; closing the laptop lid for a minute and reopening replays and catches up |\n| F3 | **Checkout + Razorpay + orders** | 🟢 | S4 `/checkout` (`CheckoutForm`: address pick / pin, payment COD min/orders/{id}/reassign`, `GET /admin/events` (riders every 2 s); stuck rules | 1.5 h | **The two-phone demo:** rider login on a phone, toggle on, walk — the marker on the laptop's tracking page walks too, ≤ 2 s behind; Picked up before ready → 409 shown as a disabled button; admin reassigns a stuck order and the customer's route redraws within a tick |\n| F6 | **Home-screen polish + v1 close** | 🟢⚪ | S16 remaining states; empty / error states; themed surfaces; landing → real home; README \"how the bus works\" with the sequence diagram | `docs/12-security-performance.md` (one page + Lighthouse numbers); `rider_track` pruning script; latency note (poll mode) | 1.5 h | Lighthouse budgets hold; v1 tagged; case-study entry drafted with the two-phone recording |\n\n**v1 total ≈ 16 h**\n\n---\n\n## v2 — Rush (≈ 11 h)\n\n### Milestone 2.0 — Humans in the loop (≈ 4 h) 🔵🟢🟠\n| # | Part | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|\n| L1 | **Rider offers + online toggle** | S8 `OfferCard` (30-s countdown ring, Accept / Decline), online / offline toggle; S9 `no_rider` flag; S5 \"Finding a rider\" now shows attempts | `offers`; `POST /rider/status`; `dispatch.offer()` chain (≤ 5, lazy expiry in the tick, sims auto-accept 3–8 s); `/rider/offers/{id}/accept` · `/decline`; stream `offer`; **test:** `offers` | 2.5 h | Decline on the phone → the next rider is offered within a tick; an expired offer cannot be accepted; two phones accepting → one assignment |\n| L2 | **Web Push** | `pushManager.subscribe` in customer, board and rider PWAs (`sw.js` `push` + `notificationclick` → the right page); opt-in prompts at the right moment (after first order / on the board / on going online) | **VAPID keys generated here** (`scripts/gen_vapid.py`); `push_subscriptions`; `services/push.py` (`pywebpush`, 410 cleanup); sends after commit on accepted / picked_up / delivered / rejected (customer), placed (restaurant), offer / assigned (rider); `GET /push/key`, `POST/DELETE /push/subscribe` | 1.5 h | With the tab closed on a phone, `picked_up` notifies within 5 s and the tap opens the tracking page; a dead endpoint is removed |\n\n### Milestone 2.1 — Menus, money, memory (≈ 7 h) 🟠🟢🟣\n| # | Part | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|\n| L3 | **Menu management + restaurant details** | S12 full editor: categories (add / rename / reorder), items (form, ₹, veg, photo drop via Blob client token, availability), restaurant details (cover, hours per weekday, open override, prep time) | `/restaurant/categories*`, `/restaurant/items*`, `/restaurant/items/{id}/photo/token` (client-upload protocol, ≤ 5 MB), `PATCH /restaurant`; revalidate on change; `restaurant_closed` in quote | 2.5 h | A new item with a photo shows on the restaurant page within the cache window; marking closed removes the restaurant from \"open now\" and refuses orders |\n| L4 | **Search, filters, history, ratings** | S1 search box (URL `q`), cuisine chips, veg toggle, sort; S6 **Reorder** with the dropped-items note; S5 rating card after delivered; stars on cards and tickets | `restaurants.search` tsvector + trigger; `/restaurants?q&cuisine&veg&sort`; `POST /orders/{id}/reorder`, `/orders/{id}/rating`; averages | 2 h | \"dosa\" finds a restaurant by item name only; reorder with one discontinued item explains what was dropped; a second rating → 409 |\n| L5 | **Refunds + ledgers + payouts + v2 close** | S13 `/restaurant/earnings`, `/rider/earnings` (balance, entries), `/admin/payouts` (balances by account, pay with reference), admin refund button | `refunds` (auto on rejected / cancelled Razorpay), `ledger_entries` on delivered (sale 80 / fee 20 / delivery ₹30 + ₹8/km / delivery_margin), `payouts`; `services/ledger.py`; `POST /admin/orders/{id}/refund`; **test:** `ledger` | 2.5 h | A delivered ₹640 order writes entries summing to ₹640 + fees; rejecting a paid order refunds once; a payout above balance → 422; v2 tagged; case study updated |\n\n**v2 total ≈ 11 h**\n\n---\n\n## v3 — Fleet (≈ 8 h)\n\n### Milestone 3.0 — Smarter dispatch, true push (≈ 8 h) ⚪🟣🔵🟢\n| # | Part | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|\n| A1 | **Batching** | S5 \"one more drop before yours\" + stop order; S8 job card with two drops; S9 stacked orders drawn as one leg | `dispatch.try_stack()` (same restaurant, drop ≤ 1.5 km off the route via `ST_DWithin` on the line, not yet picked up, max 2), multi-stop OSRM leg, `rider_legs.stops`, `orders.stack_seq`, event `stacked`; pickup marks both; per-order delivered; **test:** `batching` | 3 h | Two eligible orders → one rider, one 3-waypoint route, two correct ETAs; a far drop is not stacked; a third is not stacked |\n| A2 | **Smart ETA** | S5 `EtaBadge` with the band (\"18–24 min\"); S9 ETA error column | `prep_stats` (median / p80 of the last 20 `accepted → ready`), `riders.median_speed_mps` (last 10 legs), `eta_log` per phase with `actual_s` on delivery; `eta` events gain `band`; seed history feeds it; **test:** `prep_model` | 2 h | Mean absolute ETA error at `accepted` on the seeded history ≤ 4 min; the band never inverts |\n| A3 | **LISTEN / NOTIFY** | — | `notify_platter` trigger on `order_events` + `rider_positions`; `db.py` direct engine (`DATABASE_DIRECT_URL`); `stream.py` waits on the notification with a 5-s safety poll, automatic fallback to polling; `scripts/measure_latency.py` (50 fixes, p50 / p95) → README | 1.5 h | Measured p50 ≤ 300 ms, p95 ≤ 1 s rider POST → customer event; unplugging the direct URL falls back to polling with one log line |\n| A4 | **Heatmap + where to wait + v3 close** | S14 `/admin/heatmap` (MapLibre fill layer over hex GeoJSON, hour slider); S8 `BusyAreaHint` when idle | `ST_HexagonGrid(250 m)` over 7 days of pickups + drops; `GET /admin/heatmap?hour=`, `GET /rider/hint`; `docs/17-post-launch.md` (½ page); case study | 1.5 h | Hex counts match a SQL check; the hint changes with the hour; v3 tagged; case study live |\n\n**v3 total ≈ 8 h**\n\n---\n\n## v4 — Order together (≈ 3 h) — the unique free feature 🟢\n\n### Milestone 4.0 — One link, many phones (≈ 3 h)\nSame core, a new place: the order leaves one phone. ₹0 per use (Viraj, 2026-09-17).\n\n| # | Part | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|\n| U1 | **Group cart** | S3 **Order together** → share sheet (`navigator.share` / copy); S15 `/o/[code]`: the restaurant menu + shared cart with member names, \"add as *name*\" (name in `localStorage`), remove own, host controls; `useGroupStream` | `groups`, `group_items`, `group_events`; `POST /groups`, `GET /groups/{code}`, `POST/DELETE /groups/{code}/items`, `GET /groups/{code}/events` (stream scope: group); **test:** `group` | 2 h | An item added on phone B appears on phone A ≤ 2 s with B's name; a stranger without the code cannot guess it; only the host sees Checkout |\n| U2 | **Shared tracking + v4 close** | S15 after checkout = the S5 tracking view for every member with \"your items\" highlighted; `GroupMembers` on the host's `/orders/[id]`; README \"one link, many phones\"; `docs/17-post-launch.md` (½ page); case study | `POST /groups/{code}/checkout` (host only → one order with `group_id`, `order_items.member_name`); the group stream hands over to the order's events after checkout; links expire 24 h after delivered; add after checkout → 409 | 1 h | Both phones show the same rider gliding; phone B's items are highlighted on B only; a fresh phone with the link after delivery + 24 h sees \"expired\"; v4 tagged; case study live |\n\n**v4 total ≈ 3 h** · **Project total ≈ 38 h**\n\n---\n\n## Whole-product summary\n| Version | Milestones | Hours | Cumulative |\n|---|---|---|---|\n| v1 Kitchen | 1.0 – 1.2 | 16 | 16 |\n| v2 Rush | 2.0 – 2.1 | 11 | 27 |\n| v3 Fleet | 3.0 | 8 | 35 |\n| v4 Order together | 4.0 | 3 | 38 |\n| Add-ons (in priority order) | A storefront + embed (3) · B scheduled orders (2) · C tips (1) · D promo codes (2) · E chat (3) · F proof of delivery (2) · G Telegram bot (2) · H restaurant analytics (2) | up to 17 | up to 55 |\n\n## Add-ons (only from time saved)\n**Nice-to-have, not priority** (Viraj, 2026-09-17): considered only after v4 is fully done (docs and case study included), in this order, from time saved — and skipping all of them is a fine outcome. None is a version; none changes the engine. All free to run.\n\n| # | Add-on | What | Version it extends | ~h |\n|---|---|---|---|---|\n| A | **Restaurant storefront + embed** | `/r/[slug]/order` as a white-label page (the restaurant's name and colours, Platter in the footer) plus a one-line `<script>` embed that opens it in a drawer on the restaurant's own site; orders and tracking are the same core | v1 | 3 |\n| B | **Scheduled orders** | \"Deliver at 8 pm\" on checkout; the order sits as `scheduled` and becomes `placed` at `prep_min + travel` before the slot (lazy, in the tick) | v1 | 2 |\n| C | **Rider tips** | ₹10 / ₹20 / ₹50 on the tracking page after delivered (Razorpay); a `tip` ledger entry to the rider | v2 | 1 |\n| D | **Promo codes** | `promos(code, percent \\| flat, min_subtotal, max_uses, expires_at)` applied in the quote; the ledger keeps the discount on the platform side | v2 | 2 |\n| E | **Customer ↔ rider chat** | Canned + free-text messages over the same stream loop (`order_messages` rows → `message` events), both apps; closes at delivered | v1 | 3 |\n| F | **Proof of delivery** | The rider takes a photo at the drop (Blob client token, ≤ 2 MB); shown on the tracking page and the admin | v1 | 2 |\n| G | **Telegram status bot** | Link a chat once; status changes arrive as Telegram messages with the tracking link (Bot API, free) | v2 | 2 |\n| H | **Restaurant analytics** | Orders per hour, top items, accept time, rating trend for the last 30 days on the board | v2 | 2 |\n"}], "links": {"variants": "https://claude.ai/artifact/JAekpL7HjR4oU5c39ak7dg", "screens": "https://claude.ai/artifact/GGchE2CjZ7DN5t83pzs9Cu", "landing": "https://platter-viraj.vercel.app", "repo": "https://github.com/virajdomadia/platter"}}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const rows = D.rows, docs = D.docs, L = D.links;
  const status = {};
  let db = null, canWrite = true;

  const planEl = document.getElementById('plan');
  function renderPlan(){
    const byVer = {}; rows.forEach(r=>{ (byVer[r.version] ||= []).push(r); });
    planEl.innerHTML = '';
    for(const [ver, rs] of Object.entries(byVer)){
      const done = rs.filter(r=>status[r.id]?.status==='done').length;
      const hours = rs.reduce((a,r)=>a+parseFloat(r.est||0),0);
      const sec = document.createElement('div'); sec.className='ver';
      sec.innerHTML = `<h2>${ver} <small>${rs.length} rows · ≈ ${hours} h · ${done} done</small></h2><div class="bar" style="--p:${rs.length?done/rs.length*100:0}%"></div>`;
      let ms = '';
      rs.forEach(r=>{
        if(r.milestone!==ms){ ms=r.milestone; const h=document.createElement('div'); h.className='ms'; h.textContent=ms; sec.appendChild(h); }
        const s = status[r.id]?.status || 'todo';
        const el = document.createElement('div'); el.className='rw'+(s==='done'?' done-row':'');
        el.innerHTML = `<span class="id">${r.id}</span><div><div class="part">${r.part}</div><div class="done">${r.done}</div></div><span class="est">${r.est||''}</span><button class="st" data-s="${s}" data-id="${r.id}" ${canWrite?'':'disabled'}>${s}</button>`;
        sec.appendChild(el);
      });
      planEl.appendChild(sec);
    }
    const total = rows.length, done = rows.filter(r=>status[r.id]?.status==='done').length;
    document.getElementById('st-done').textContent = done; document.getElementById('st-total').textContent = total;
    document.getElementById('st-hours').textContent = Math.round(rows.reduce((a,r)=>a+parseFloat(r.est||0),0)) + ' h';
  }
  planEl.addEventListener('click', async e=>{
    const b = e.target.closest('.st'); if(!b || !db || !canWrite) return;
    const id = b.dataset.id, next = {todo:'doing', doing:'done', done:'todo'}[b.dataset.s];
    b.disabled = true;
    try{ await db.doc('rows/'+id).set({status: next, updated: new Date().toISOString()}); }
    catch(err){ if(err && (err.code==='not_granted' || err.code==='permission_denied')){ canWrite=false; document.getElementById('plan-note').textContent='Read-only for you — status can only be changed by editors.'; } }
    b.disabled = false;
  });
  renderPlan();
  (async()=>{
    db = await claude.use('db');
    if(!db){ document.getElementById('plan-note').textContent = 'Status is not available in this view.'; canWrite=false; renderPlan(); return; }
    const user = await claude.use('user'); const cw = user ? await user.can('data.write') : null; if(cw===false){ canWrite=false; document.getElementById('plan-note').textContent='Read-only for you — status can only be changed by editors.'; }
    db.collection('rows').onSnapshot(snap=>{ snap.docs.forEach(d=>{ if(d.exists) status[d.id]=d.data(); }); snap.docChanges().forEach(c=>{ if(c.type==='removed') delete status[c.doc.id]; }); renderPlan(); }, ()=>{});
  })();

  const nav = document.getElementById('docnav'), art = document.getElementById('doc');
  const renderer = new marked.Renderer();
  renderer.code = function(code, lang){ const c = typeof code==='object' ? code.text : code; const l = typeof code==='object' ? code.lang : lang; if(l==='mermaid') return '<pre class="mermaid">'+c.replace(/</g,'&lt;')+'</pre>'; return '<pre><code>'+c.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>'; };
  renderer.table = function(header, body){ if(typeof header==='object'){ const t=header; const h='<tr>'+t.header.map(c=>'<th>'+marked.parseInline(c.text)+'</th>').join('')+'</tr>'; const b=t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+marked.parseInline(c.text)+'</td>').join('')+'</tr>').join(''); return '<div class="tbl"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>'; } return '<div class="tbl"><table><thead>'+header+'</thead><tbody>'+body+'</tbody></table></div>'; };
  function showDoc(i){ nav.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected', i===j)); art.innerHTML = marked.parse(docs[i].md, {renderer, gfm:true}); art.querySelectorAll('a[href^="docs/"],a[href^="../"],a[href$=".md"]').forEach(a=>{ const n=a.getAttribute('href').split('/').pop().replace('.md',''); const k=docs.findIndex(d=>d.name===n); if(k>=0){ a.href='#'; a.onclick=e=>{e.preventDefault(); showDoc(k); window.scrollTo({top:0});}; } }); if(window.mermaid){ try{ mermaid.initialize({startOnLoad:false, theme:'neutral'}); mermaid.run({nodes: art.querySelectorAll('pre.mermaid')}); }catch(e){} } }
  docs.forEach((d,i)=>{ const b=document.createElement('button'); b.textContent=d.name; b.setAttribute('aria-selected', i===0); b.onclick=()=>showDoc(i); nav.appendChild(b); });
  showDoc(0);

  document.getElementById('mock').innerHTML = [
    ['Direction variants', 'Twelve directions over two rounds (A–F: Menu card, Night kitchen, Dabba, Dispatch, Newsprint, Poster · G–L: Glass, Zine, Receipt, Neon, Atlas, Bento), six screens each, twelve live motion candidates over a real Koramangala map. Chosen: L · Bento (2026-09-17).', L.variants, 'Open variants'],
    ['Screens · v1', 'Every v1 screen in Bento: home (phone + desktop), restaurant, cart, checkout (+ Razorpay dismissed), tracking (phone + desktop, live), orders, restaurant board, rider app (before / after sharing), admin map, sign in + demo, addresses, menu availability, states.', L.screens, 'Open screens'],
    ['Landing · live', 'The existing landing page, deployed on Vercel from web/ (will move to platter.virajdomadia.com).', L.landing, 'Open landing'],
    ['Photos + maps', 'CC dish photos from Wikimedia Commons and OpenStreetMap tiles of Koramangala / HSR in mockups/img/ with credits in CREDITS.md — Platter and its restaurants are fictional.', L.repo + '/blob/main/mockups/img/CREDITS.md', 'Credits'],
  ].map(([t,p,u,b])=>`<div class="card"><div class="k">mockup</div><h3>${t}</h3><p>${p}</p><a class="btnl" href="${u}" target="_blank" rel="noopener">${b} ↗</a></div>`).join('');

  document.getElementById('proj').innerHTML = [
    ['Name', '<b>Platter</b> · hot food, tracked to your door · project 6 of 6, build last'],
    ['One-liner', 'A four-sided food-delivery platform for one Bengaluru neighbourhood: customers watch the rider move on a real map, restaurants run a live board, riders share GPS from a phone, an admin sees everything — PostGIS, a role-guarded order state machine, live location over SSE with Postgres as the bus. ₹0 per order.'],
    ['URLs', 'platter.virajdomadia.com · api.platter.virajdomadia.com · landing at platter-viraj.vercel.app until DNS'],
    ['Repo', `<a href="${L.repo}" target="_blank" rel="noopener">github.com/virajdomadia/platter</a> · web/ Next.js 15 + MapLibre · api/ FastAPI + PostGIS + the stream loop`],
    ['Versions', '<b>v1 Kitchen</b> 16 h → <b>v2 Rush</b> 11 h → <b>v3 Fleet</b> 8 h → <b>v4 Order together</b> 3 h ≈ 38 h · add-ons after v4 only from time saved'],
    ['Unique feature', 'v4 Order together: one link, many phones — a group cart friends add to from their own phones, one pays, and the same link becomes everyone\'s live tracking page. ₹0 per use.'],
    ['Engine', 'Rider POSTs GPS every 3 s → rider_positions + rider_track; every transition appends to order_events (the bus); one stream loop serves customer / board / rider / admin over SSE with Last-Event-ID replay and a 280-s cut; sim riders advance lazily inside the tick; v3 swaps the 1-s poll for LISTEN/NOTIFY'],
    ['Geo at ₹0', 'PostGIS (ST_DWithin, KNN nearest rider) · MapLibre + OpenFreeMap tiles · OSRM public routes once per leg with a straight-line fallback · Photon geocoding'],
    ['Money', 'COD default + Razorpay (idempotent mark_paid) in v1; refunds + ledgers (restaurant 80/20, rider ₹30 + ₹8/km) + admin payouts in v2'],
    ['Seed', 'Koramangala + HSR · 12 fictional restaurants · ~100 dishes with CC photos · 8 sim riders + 1 demo rider · ~60 past orders · demo logins: customer, restaurant, rider, admin'],
    ['Direction', 'L · Bento — pastel tiles (lavender, mint, peach, lemon, sky), Nunito 900, the map as the biggest tile, tile spring on every screen; signature = Rider glide + Route draw on tracking, ticket print on the board'],
    ['Lifecycle', 'Steps 1–7 complete (2026-09-17). Next: step 8 = milestone 1.0, last in the build order (1 → 2 → 4 → 5 → 3 → 6)'],
    ['Rules', 'Lean setup, rich features · accounts just-in-time (Neon + PostGIS and Blob in S2; Razorpay in F3; VAPID in L2) · one PR per row, every PR visible in the browser · tests only from 04 §12 · tracker updated per milestone'],
  ].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');

  const tabs=[...document.querySelectorAll('.tab')];
  function show(p){ tabs.forEach(t=>t.setAttribute('aria-selected', t.dataset.p===p)); document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on', x.id==='p-'+p)); try{localStorage.setItem('pl-tab',p)}catch(e){} }
  tabs.forEach(t=>t.onclick=()=>show(t.dataset.p));
  let start='plan'; try{ start=localStorage.getItem('pl-tab')||'plan'; }catch(e){} show(start);
})();
</script>
