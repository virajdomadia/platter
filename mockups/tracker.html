": "2 h", "done": "An item added on phone B appears on phone A ≤ 2 s with B's name; a stranger without the code cannot guess it; only the host sees Checkout"}, {"id": "U2", "part": "Shared tracking + v4 close", "version": "v4 Order together", "milestone": "Milestone 4.0 · One link, many phones", "est": "1 h", "done": "Both phones show the same rider gliding; phone B's items are highlighted on B only; a fresh phone with the link after delivery + 24 h sees \"expired\"; v4 tagged; case study live"}], "docs": [{"name": "PRD", "path": "PRD.md", "md": "# PRD — Platter: Food delivery with live rider tracking\n\n**Status:** v1 · lifecycle steps 1–7 complete (2026-09-17) — see [docs/](docs/) · next: step 8 Project Setup (= milestone 1.0), **last in the build order** (1 → 2 → 4 → 5 → 3 → 6)\n**Name:** Platter · *hot food, tracked to your door*\n**URL:** https://platter.virajdomadia.com (landing live at https://platter-viraj.vercel.app until DNS)\n**Slot:** #6 · Budget ~38 h (v1 16 · v2 11 · v3 8 · v4 3) · Build last\n**Live artifacts:** [Tracker](https://claude.ai/artifact/HEHpyrigHuZpBMoECDs4qG) (plan rows with status, all docs, mockups, project facts) · [Screens](https://claude.ai/artifact/GGchE2CjZ7DN5t83pzs9Cu) (every v1 screen in the chosen direction) · [Direction variants](https://claude.ai/artifact/JAekpL7HjR4oU5c39ak7dg) (A–L, L chosen) · Landing: https://platter-viraj.vercel.app\n\n## One-liner\nA four-sided food-delivery platform for one Bengaluru neighbourhood — **customers** pin a location, order from restaurants nearby and **watch the rider move on a real map**; **restaurants** run a live order board on a tablet; **riders** get dispatched, share their GPS from a phone and mark pickup / drop; an **admin** sees every active order and rider on one map and can reassign — built on PostGIS, an order state machine guarded by role, and **live location over SSE with Postgres as the bus**. No paid map, routing, realtime or AI service: ₹0 per order.\n\n## Who it's for\n- **Customer:** ordering dinner on a phone; wants the restaurants that can actually reach them, a fair ETA, and to see the rider coming.\n- **Restaurant:** one owner per restaurant with a tablet in the kitchen; wants new orders to be loud and one-tap to accept, cook, and hand over.\n- **Rider:** a phone in a handlebar mount; wants the next job, the route, and two big buttons (picked up / delivered).\n- **Admin (platform):** one operator; wants the live map, stuck orders, and a reassign button. A small real UI, not code.\n\n## Why this project\n- **Geo + realtime + a multi-role state machine** is the closest a portfolio gets to Swiggy-scale problems: restaurants within radius and nearest-rider dispatch in PostGIS, a role-guarded `placed → … → delivered` machine, and rider GPS streamed to exactly the people who should see it.\n- **The realtime is ours, and it is honest.** Riders post GPS every 3 s; `order_events` is an append-only log that doubles as the message bus; the API streams SSE from FastAPI on Vercel; v3 replaces the 1-s poll with `LISTEN/NOTIFY` and measures the latency. No Pusher, no Firebase, no WebSockets to host.\n- **₹0 infrastructure for a map product:** MapLibre + OpenFreeMap tiles, OSRM's public router with a straight-line fallback, Photon geocoding — every \"expensive\" part of a delivery app is done with open data.\n- **Four roles you can demo from the landing** — customer · restaurant · rider · admin — and the wow moment works with two phones: the rider walks, the marker moves.\n- **The unique feature (v4, ₹0 per use): Order together.** One link, many phones: friends add to the cart from their own phones, one pays, and the same link becomes everyone's live tracking page.\n\n## Locked decisions (2026-09-17) — follow these until the project ends\n\n### 1. Live location: SSE from FastAPI, Postgres as the bus (the hard part)\n- **Producers:** a rider's phone `POST /rider/position { lat, lng, heading, speed, at }` every 3 s while \"Share my location\" is on (`watchPosition`, sent only if moved ≥ 5 m or 3 s passed). One row per rider in `rider_positions` (PostGIS `geography(Point)`, heading, speed, `recorded_at`); every position while on a job is also appended to `rider_track(order_id, at, loc)` for the trail and the case study. Every status transition appends a row to **`order_events(seq bigserial, order_id, kind, payload, at)`** — that log is the bus.\n- **Consumers:** `GET /orders/{id}/events` (customer, v4 group members), `GET /restaurant/events` (the board), `GET /rider/events` (assignment, status), `GET /admin/events` (everything + every rider every 2 s). One loop in `services/stream.py`: every 1 s read `order_events` newer than the last seq and positions newer than the last timestamp, `yield` them as SSE (`id: {seq}:{pos_ms}`, `event: status | rider | eta | route | offer | ping`), `retry: 1000`, a `ping` every 15 s, and close cleanly at **280 s** (Vercel's 300-s function limit); `EventSource` reconnects with `Last-Event-ID` and misses nothing because the log is durable. Simulated riders are advanced inside the same tick (decision 3).\n- **Why not polling / a hosted service:** polling the tracking page every 3 s is a 3-s lag with nothing to show; Pusher / Ably add a key, a free-tier cap and hide the thing the project proves. SSE over Postgres costs nothing, degrades to \"reconnect and catch up\", and v3 makes it push-based with `LISTEN/NOTIFY` on a direct Neon connection.\n- **Proof:** a position posted from the rider phone appears on the customer's map in ≤ 2 s (measured in the case study); killing the stream mid-order and reconnecting replays every missed event; a customer can only open the stream for their own order (403 otherwise).\n\n### 2. Geo, maps and routing at ₹0\n- **PostGIS on Neon** (`create extension postgis`): `restaurants.loc`, `addresses.loc`, `rider_positions.loc` are `geography(Point, 4326)` with GIST. Restaurants for a pin = `ST_DWithin(loc, pin, 8000)` ordered by `ST_Distance` — ≤ 5 km orderable, 5–8 km shown greyed as \"Too far\"; nearest available rider = KNN `loc <-> restaurant.loc`.\n- **Map:** MapLibre GL JS with **OpenFreeMap** vector tiles (`https://tiles.openfreemap.org/styles/liberty`, no key, no quota) — light style for customer / restaurant / admin, a dark variant on the rider phone.\n- **Routes and ETA:** **OSRM public server** (`router.project-osrm.org/route/v1/driving/…?overview=full&geometries=polyline`) called **once per leg** (rider → restaurant, restaurant → customer) and cached on `rider_legs` (polyline, distance, duration). ETA = remaining prep time (until `ready`) + travel time of the remaining polyline at the rider's recent speed (min 12, max 30 km/h). Fallback when OSRM fails: straight line × 1.3 at 22 km/h, `eta.method = \"line\"` shown as \"≈\".\n- **Addresses:** a draggable pin on MapLibre + **Photon** (`photon.komoot.io/api`, `/reverse`) for search and the label; saved addresses per customer; the seed's default pin is Koramangala 5th Block. Delivery radius 5 km; a restaurant outside it is shown greyed with \"Too far\".\n- **Delivery fee:** ₹25 up to 2 km, then ₹8 per started km of the route distance (or straight line × 1.3); the 5 km radius itself is always straight-line so the list and checkout agree; platform fee ₹5; integer paise everywhere; no minimum order.\n\n### 3. Riders: simulated and real\n- **Simulated riders (8)** have no process. A sim rider's position at any moment = the point along its current leg's polyline at `min(1, (now − leg.started_at) / leg.duration_s)`, where the sim's `duration_s` = the leg's distance ÷ its own `speed_kmh` (22 ± 10 %); the SSE tick computes it and pushes it like a real fix. Arrival advances the world lazily and idempotently (`select … for update skip locked`): leg *to_restaurant* complete → wait at the restaurant until the order is `ready` → `picked_up` + leg *to_customer*; that leg complete → `delivered` → rider `available` → takes the oldest order waiting for a rider. `advance_simulation()` runs inside every stream tick and every order read or transition, so the world is always consistent whoever looks first.\n- **The demo rider** is real: the landing's rider login lands on `/rider` on a phone with a job already assigned and \"Share my location\" off; switching it on streams the phone's GPS (`watchPosition`, wake lock, foreground only — a PWA on the home screen). Two phones = the wow moment.\n- The customer never learns which kind of rider they got; the admin map marks sims with a dotted ring.\n\n### 4. Payments: COD default + Razorpay in v1\n- `POST /orders` prices server-side (items from the DB, availability checked, fee from decision 2) → `payment = cod` → `placed` immediately; `payment = razorpay` → `pending_payment` → Standard Checkout modal → verify (HMAC) or webhook `payment.captured` → the same idempotent **`mark_paid()`** → `placed` + `order_events`. Unpaid orders expire lazily after 15 min. The restaurant board never sees `pending_payment`.\n- Refund on rejection (v2): a rejected Razorpay order is refunded automatically; COD needs nothing.\n- **Money to three parties (v2):** `ledger_entries` — restaurant `sale` +80 % / platform `fee` +20 % of the food subtotal, rider `delivery` ₹30 + ₹8/km of the leg, platform keeps the delivery + platform fee minus the rider's pay; admin marks payouts paid. Razorpay Route stays out.\n\n### 5. Dispatch: nearest now, offers in v2, batching in v3\n- **v1:** the moment a restaurant **accepts**, `assign_rider(order)` locks the nearest `available` rider (KNN) → rider `busy`, `orders.rider_id`, leg *to_restaurant* via OSRM, event `rider_assigned` — the rider rides while the food cooks. No rider free → the order waits (`rider_id null`, the customer sees \"Finding a rider\"); a rider becoming free takes the oldest waiting order. Admin can **reassign** to any available rider (the old leg is closed, a new one drawn).\n- **v2:** `offers(order, rider, expires_at)` — the nearest rider gets 30 s to **accept / decline** on the phone (a countdown ring); decline or timeout → the next nearest, up to 5; after that the order waits and the admin is flagged. Riders go `offline / available / busy`.\n- **v3 batching:** when a rider is assigned or picking up at restaurant R, a second `accepted` order from R whose drop is ≤ 1.5 km off the first drop's route is stacked onto the same rider → a multi-stop leg (OSRM with three waypoints); both customers' ETAs update; max 2 orders per rider.\n\n### 6. Seed: one neighbourhood, 12 restaurants, ~100 dishes, 9 riders\nKoramangala + HSR Layout (~4 × 4 km). 12 fictional restaurants (each with an owner login), 6–10 items each with real **CC-BY / CC0 photos from Wikimedia Commons** (biryani, masala dosa, thali, momos, paneer, chole bhature, pav bhaji, filter coffee, rasmalai …; credits in `api/app/seed/CREDITS.md`), realistic prep times (12–25 min) and hours; 8 simulated riders parked at real junctions + 1 demo rider; the demo customer with three saved addresses and ~10 past orders; ~60 historical orders over 30 days so dashboards, ratings (v2) and the ETA model (v3) have data. Four demo logins on the landing: **customer**, **restaurant** (Koramangala Social — the busiest), **rider**, **admin**.\n\n### 7. Versions — base → mid → advanced\nEvery project is cut base → mid → advanced (rule set 2026-09-15), plus one unique free feature as v4 (rule set 2026-09-17). v1 alone is a complete delivery platform with live tracking; each later version adds humans, money or intelligence to dispatch, never a second engine.\n\n| Version | Ships | Proves | ~Hours |\n|---|---|---|---|\n| **v1 Kitchen** (base) | Auth (email + password, `pl_session`, roles customer / restaurant / rider / admin; four demo logins) · **home**: location pin + Photon search → restaurants within 5 km by distance / ETA · restaurant page + menu + cart · **checkout** COD + Razorpay (idempotent `mark_paid`) · **order state machine** `placed → accepted → preparing → ready → picked_up → delivered` (+ `rejected`, `cancelled`), every transition role-guarded and logged · **live tracking page** (MapLibre, route drawn, rider marker gliding over SSE, ETA, status rail, trail) · **restaurant board** (tablet, live over SSE: new-order ticket, accept / reject, preparing, ready; item availability toggle; today's numbers) · **rider app** (phone PWA: current job, route, Share my location, picked up / delivered, next job) · **auto-dispatch** nearest available rider · **admin live map** (every order + rider, stuck orders, reassign) · sim riders · seed (decision 6) | PostGIS, the SSE bus, the state machine across four roles, ₹0 maps | 16 |\n| **v2 Rush** (mid) | Rider **offers** (accept / decline / 30-s timeout chain, online / offline) · **Web Push** (VAPID, `pywebpush`, free) for customer status, new-order on the board, new job on the rider · restaurant **menu management** (categories, items, photos, hours, open / closed) · search + cuisine + veg filters + sort · order history + reorder · ratings (restaurant + rider) · refund on rejection · **ledgers + payouts** (restaurant 80/20, rider ₹30 + ₹8/km, admin marks paid) | Humans in the dispatch loop; push; money to three parties | 11 |\n| **v3 Fleet** (advanced) | **Batching** (stacked orders, multi-stop legs) · **smart ETA** (per-restaurant prep learned from the last 20 `accepted → ready`, rider's own speed, a confidence band on the tracking page) · **`LISTEN/NOTIFY`** replaces the 1-s poll in the stream loop, end-to-end latency measured and published · admin **demand heatmap** (PostGIS hex bins over 7 days) + \"where to wait\" hint on the rider app | Real dispatch logic; true push; geo analytics from own data | 8 |\n| **v4 Order together** (unique, free) | **One link, many phones** — `/o/{code}`: before checkout it is a **group cart** (anyone with the link adds items under their name from their own phone, live over the same SSE core; the host sees who added what and pays once); after checkout the **same link is the shared live tracking page** for everyone in the group, each phone marking \"your items\" | Reach: the order leaves one phone, and the core doesn't change (Viraj, 2026-09-17) | 3 |\n\n### 8. Stack and setup — lean\nShared stack from [`projects/README.md`](../README.md): `web/` Next.js App Router + Tailwind 4, `api/` FastAPI on Vercel (FastAPI preset, `bom1`), Neon Postgres **with PostGIS**, own cookie-session auth (`pl_session`), Razorpay (test mode). New deps: `maplibre-gl` in web; `geoalchemy2`, `polyline` (decode; the polyline maths are pure Python), `httpx` (OSRM, Photon, Razorpay), `razorpay`, `pywebpush` (v2) in api. Setup is the minimum to deploy both apps with plain CI (web typecheck + build, api ruff + pytest with a `postgis/postgis` service). OpenAPI → TS types by script, committed, not CI-gated; no Sentry, no uptime monitor. **Accounts and keys are created just-in-time** in the plan row that first needs them: Neon (+ PostGIS) in S2, Vercel Blob (dish photos) in S2's seed, Razorpay in F3, VAPID keys (generated locally, free) in L2.\n\n## The wow moment (v1)\nOpen the landing on your laptop as the **customer**, pin your location, order a masala dosa; the restaurant tablet (second tab) rings and prints a ticket — Accept. A rider is found in a radar ping and starts moving along the real streets of Koramangala toward the kitchen. Mark it Ready; the rider picks up and the ETA drops as the marker glides toward your pin. Now open the **rider** login on your phone, switch on *Share my location* and walk down the corridor — the marker on the laptop walks with you.\n\n## Add-ons (after v4, only from time saved)\nNice-to-have, not priority (Viraj, 2026-09-17): listed in [docs/07-plan.md](docs/07-plan.md) — restaurant white-label storefront + embed · scheduled orders · rider tips · promo codes · customer ↔ rider chat · proof-of-delivery photo · Telegram status bot · restaurant analytics. Skipping all of them is fine.\n\n## Out of scope (all versions)\nMulti-city · real turn-by-turn navigation · paid maps, routing, realtime or AI services · restaurant onboarding / KYC · GST invoices · native apps (the rider app is a PWA) · multi-restaurant carts · real-money billing · surge pricing · scheduled shifts · customer support tooling · multiple admins.\n\n## Success criteria\n- **A position posted by the rider phone appears on the customer's map within 2 s** (SSE, measured); the stream survives the 280-s cut and a network drop with no missed event (`Last-Event-ID` replay covered by a test).\n- **Every state transition is validated server-side by role** (tests: a customer cannot accept, a restaurant cannot mark delivered, a rider cannot touch an order not assigned to them; illegal transitions → 409).\n- Restaurants within 5 km of any pin in the seed area are returned sorted by distance in ≤ 150 ms (PostGIS GIST); the nearest-rider query is a single KNN.\n- An order placed with COD reaches `delivered` by a simulated rider without any human action after the restaurant marks `ready`; ETA on the tracking page is within ±3 min of the actual delivery for sim riders.\n- Razorpay: verify-then-webhook and webhook-then-verify → exactly one `placed`; replayed webhooks are no-ops; an unpaid order expires at 15 min and never reaches the board.\n- Lighthouse mobile ≥ 90 perf / 100 a11y / 100 SEO on home and restaurant pages (map pages excluded from the perf budget; MapLibre loaded on demand; dish photos via `next/image`, no CLS).\n- v4: a friend with the link adds an item from a second phone and it appears on the host's cart within 2 s; after payment both phones show the same rider.\n- A visible frontend signature (chosen in step 4, direction **L · Bento**, [docs/04-ui-mockups.md](docs/04-ui-mockups.md)): **Rider glide + Route draw** on the tracking page, **Tile spring** on every screen, the **ticket print** on the restaurant board, Plate slide in the cart, themed browser surfaces, reduced-motion fallbacks.\n\n## Resolved questions\n- *Polling, SSE, or a hosted realtime service?* SSE from FastAPI with Postgres (`order_events` + `rider_positions`) as the bus; `LISTEN/NOTIFY` in v3 (Viraj, 2026-09-17, fork 1: \"choose what is best\").\n- *Which map, routing and geocoder at ₹0?* MapLibre + OpenFreeMap, OSRM public with a straight-line fallback, Photon (fork 2).\n- *Simulated riders or real GPS?* Both — lazy sims for the public demo, a real demo rider for two-phone demos (fork 3).\n- *Razorpay only or COD?* COD default + Razorpay, same `mark_paid` recipe as Skillroom / Offcut (fork 4).\n- *How is a rider chosen?* v1 nearest-available at accept, v2 offers with timeout, v3 batching (fork 5).\n- *How big is the seed?* One neighbourhood, 12 / ~100 / 9, 60 past orders (fork 6).\n- *v4?* Order together (one link, many phones) over a public tracking link and a restaurant storefront, which became add-ons (Viraj, 2026-09-17).\n- *WebSockets?* No — Vercel functions don't hold them; SSE is one-way and that is all tracking needs; the rider's uplink is plain POSTs.\n- *Auth: Better Auth / Drizzle?* No — those were the old TS-stack notes; own cookie session in FastAPI like every other project.\n"}, {"name": "03-requirements", "path": "docs/03-requirements.md", "md": "# Platter — Requirements & Scope\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-17 · **Source:** [PRD.md](../PRD.md) locked decisions. Flows and screen index: [03-user-flows.md](03-user-flows.md).\n\nActors: **Customer** (signed in to order; browsing is public), **Restaurant** (one owner per restaurant, `/restaurant`), **Rider** (`/rider`, a phone), **Admin** (`/admin`), **Sim** (the lazy simulation, runs inside API requests). Each requirement ends with **Accept:** — the check that closes it. Ids: R = v1, R2 = v2, R3 = v3, R4 = v4. Money in ₹, integer paise in the DB; distances in metres; times in seconds.\n\n---\n\n## v1 — Kitchen (base, ≈ 16 h)\n\n### R1. Auth & roles\n- Email + password, cookie session (`pl_session`, HttpOnly, SameSite=Lax, 30 d); sign up / in / out. `users.role ∈ {customer, restaurant, rider, admin}`; a restaurant user owns exactly one `restaurants` row, a rider user exactly one `riders` row. Four demo logins on the landing (`POST /auth/demo`).\n- `/restaurant/*` requires `restaurant`, `/rider/*` requires `rider`, `/admin/*` requires `admin` — 404 to anyone else. `/checkout`, `/orders/*` require any session; a customer sees only their own orders.\n- **Accept:** a customer never sees the board, the rider app or the admin; a restaurant sees only its own orders; sessions expire after 30 days.\n\n### R2. Location & discovery\n- Home: the delivery pin (browser geolocation with permission, else the last saved address, else the seed default — Koramangala 5th Block) on a MapLibre map with a draggable marker; Photon search box for an address; saved addresses list (label, line, pin).\n- `GET /restaurants?lat=&lng=` → restaurants within **5 km** (`ST_DWithin`), sorted by distance, each with distance, ETA (prep + travel), cuisines, veg flag, rating (v2), cover; restaurants 5–8 km appear greyed \"Too far\"; closed restaurants show hours.\n- Restaurant page `/r/[slug]`: cover, name, area, cuisines, prep time, distance / delivery fee for the current pin, menu by category with photos, veg / non-veg marks, `is_available` (unavailable items greyed, not addable).\n- **Accept:** for any pin in the seed area the list returns in ≤ 150 ms with correct order (SQL check against `ST_Distance`); moving the pin 3 km re-sorts and re-prices; an unavailable item cannot be added (422 on `POST /orders`).\n\n### R3. Cart & checkout\n- Cart per restaurant in `localStorage` (switching restaurant asks to clear). `/checkout`: items, address (saved or the current pin with a line typed), payment `cod | razorpay`, note to restaurant; totals from `POST /orders/quote` (subtotal, delivery fee, platform fee ₹5, total).\n- `POST /orders` prices everything server-side: current item prices, availability, restaurant open, address within 5 km **straight-line** (the same `ST_DWithin` rule as the list, so an orderable restaurant never fails at checkout), fee ₹25 up to 2 km + ₹8 per started km of the **route** distance (OSRM, else straight line × 1.3). COD → `placed`; Razorpay → `pending_payment` + Razorpay order → modal → `POST /orders/{id}/verify` or webhook → **`mark_paid()`** → `placed`. Unpaid orders `expired` lazily after 15 min. Order number `PL-####`.\n- **Accept (tests):** the total equals the quote for the same payload; a tampered client price is ignored; verify-then-webhook and webhook-then-verify → exactly one `placed` event; replay is a no-op; an address at 6 km straight-line → 422 `out_of_range`, while 4.9 km straight / 6.2 km by road is accepted with the road-based fee.\n\n### R4. The order state machine\n- `status ∈ {pending_payment, placed, accepted, preparing, ready, picked_up, delivered, rejected, cancelled, expired}`. Transitions and who may make them:\n\n| From → To | Who | Side effects |\n|---|---|---|\n| `pending_payment → placed` | `mark_paid` (system) | event `placed`; board sees it |\n| `placed → accepted` | restaurant | `assign_rider()` (R6); `accepted_at` |\n| `placed → rejected` | restaurant (reason) | refund if Razorpay (v2); event |\n| `placed → cancelled` | customer (only while `placed`) | refund (v2) |\n| `accepted → preparing` | restaurant | — |\n| `preparing → ready` | restaurant | `ready_at`; a waiting sim rider picks up |\n| `ready → picked_up` | assigned rider (or sim) | leg *to_customer*; `picked_up_at` |\n| `picked_up → delivered` | assigned rider (or sim) | rider `available` → takes the oldest waiting order; `delivered_at` |\n| `pending_payment → expired` | lazy, 15 min | — |\n\n- Every transition runs in one transaction under `select … for update`, checks the role and the current status, writes `orders.status` and appends `order_events(kind = status, payload)`; anything else → 409 `illegal_transition` with `{ from, to }`.\n- **Accept (tests):** every row of the table succeeds for its actor and 409s for every other actor; `preparing → delivered` is refused; two concurrent `accept`s produce one `accepted` event.\n\n### R5. Live tracking (customer)\n- `/orders/[id]`: MapLibre map with the restaurant, the drop pin, the route polyline, the rider marker and its trail; a status rail `Placed · Accepted · Cooking · Ready · Picked up · Delivered` lit from `order_events`; ETA; the order summary; \"Cancel\" while `placed`; the rider's name and a mock call button once assigned.\n- `GET /orders/{id}/events` (SSE, owner only): `route` once per leg (polyline, distance, duration), `status` per event, `rider` for every new position (≤ 1 s after it lands), `eta` whenever status or position changes, `ping` every 15 s; `id: {seq}:{pos_ms}`; the server closes at 280 s and `EventSource` reconnects with `Last-Event-ID`.\n- The marker **glides** between fixes (interpolated over the 3-s interval, heading-rotated); reduced motion: jumps.\n- **Accept:** a position posted by the rider phone is on the customer map ≤ 2 s later (measured with `performance.now()` on both ends in the case study); killing the connection for 20 s and reconnecting replays every missed event exactly once (test with a fake clock); a stranger's `GET /orders/{id}/events` → 403.\n\n### R6. Dispatch\n- `assign_rider(order)` on `accepted`: `select riders … where status = 'available' order by loc <-> restaurant.loc limit 1 for update skip locked` → rider `busy`, `orders.rider_id`, `rider_legs(to_restaurant)` with OSRM polyline (fallback straight line), events `rider_assigned` + `route`. None available → `rider_id null` and the tracking page shows \"Finding a rider\"; `on_rider_available(rider)` assigns the oldest `accepted | preparing | ready` order without a rider.\n- Admin `POST /admin/orders/{id}/reassign { rider_id }`: the current rider (if any) is released to `available`, the new one assigned, a new leg drawn, event `rider_reassigned`.\n- **Accept (tests):** with three riders at known points the nearest is chosen; `skip locked` under two concurrent accepts never double-books a rider; reassigning releases the old rider; an order waiting for a rider is taken the moment one becomes available.\n\n### R7. Rider app\n- `/rider` (phone, installable PWA): status toggle (online / offline in v2; v1 only *Share my location*), current job card (restaurant → customer, items count, distance, pay preview), a dark MapLibre map with the leg's route and the rider's own position, two big buttons **Picked up** (enabled at `ready`) and **Delivered**, next job when free, today's deliveries count.\n- *Share my location* → `navigator.geolocation.watchPosition` (high accuracy) → `POST /rider/position` every 3 s or ≥ 5 m; a screen wake lock while on; the toggle state survives reloads. `GET /rider/events` pushes assignment and order status to the phone.\n- **Accept:** on a phone, switching the toggle on posts positions (network tab) and the customer map moves; *Picked up* before `ready` → 409; *Delivered* ends the job and the next waiting order (if any) is offered within one tick.\n\n### R8. Restaurant board\n- `/restaurant` (tablet / desktop, landscape): columns **New · Cooking · Ready · Out for delivery**, each order as a ticket (number, items, note, customer first name, payment, age); **Accept / Reject** on new, **Preparing** and **Ready** buttons, the rider's name + distance once assigned; a chime + a printed-ticket entrance on new orders (`GET /restaurant/events`); today's totals (orders, revenue, avg accept time). `/restaurant/menu` (v1: availability toggles only).\n- **Accept:** a new order appears on the board ≤ 2 s after `placed` without a refresh; toggling an item off removes it from the customer menu on the next request and blocks it in `POST /orders`.\n\n### R9. Admin\n- `/admin`: a live MapLibre map of every active order (restaurant → rider → drop) and every rider (available / busy / offline; sims with a dotted ring), an orders list with status, age and **stuck** flags (`placed` > 5 min unaccepted, `accepted` > 3 min without a rider, `ready` > 10 min not picked up), **Reassign** with a rider picker, today's numbers. `GET /admin/events` streams every order event and all rider positions every 2 s.\n- **Accept:** reassigning an order moves its marker to the new rider within one tick; a stuck order is flagged at the right age (test with a fake clock).\n\n### R10. Simulation & seed\n- `advance_simulation()` (decision 3) runs at the top of every stream tick and inside every order read / transition: for each sim rider on a leg, compute progress; leg complete → the transition of R4 as the rider, or wait for `ready`. Sim speed 22 km/h ± 10 % per rider; a sim rider \"posts\" a position each tick (the stream computes it; `rider_positions` is upserted every 3 s so admin / restaurant views agree).\n- Idempotent seed: admin; demo customer (three saved addresses, ~10 past orders); 12 restaurants with owner logins, categories, ~100 items with CC photos in Blob (`api/app/seed/fetch_photos.py` — Commons API, licence filter, backoff, `CREDITS.md`); 8 sim riders at real junctions + the demo rider; ~60 delivered orders over 30 days with events, legs and tracks; two live orders in progress so the demo has something moving from the first second.\n- **Accept:** `seed` runs twice without duplicates; an order placed with COD reaches `delivered` with no human action after the restaurant marks `ready` (test with a fake clock: the sim arrives, picks up, delivers); ETA on sims is within ±3 min of the actual delivery.\n\n---\n\n## v2 — Rush (mid, ≈ 11 h)\n\n### R2-1. Offers\n- `riders.status ∈ {offline, available, busy}` with an online toggle on the rider app. On `accepted`: `offers(order, rider, expires_at = now + 30 s)` to the nearest available rider not already offered this order; `GET /rider/events` pushes `offer` with a countdown; **Accept** → assigned (as v1); **Decline** or expiry → the next nearest, up to 5 riders; then the order waits and the admin sees it flagged. Expiry is lazy (checked in the tick).\n- **Accept (tests):** decline → the next rider is offered within one tick; an expired offer cannot be accepted (409); accepting from two phones at once yields one assignment.\n\n### R2-2. Web Push\n- VAPID keys (generated once, free); `push_subscriptions(user, endpoint, keys)` from `pushManager.subscribe` in the customer, board and rider PWAs; `pywebpush` sends: customer → accepted / picked up / delivered / rejected; restaurant → new order; rider → new offer / assignment. Stale endpoints (410) deleted.\n- **Accept:** with the tab closed on a phone, `picked_up` produces a notification within 5 s; a 410 endpoint is removed.\n\n### R2-3. Menu management\n- `/restaurant/menu`: categories (add, rename, reorder), items (name, description, ₹, veg, photo upload via Blob client token ≤ 5 MB, availability), restaurant details (cover, hours per weekday, `is_open` override, prep time).\n- **Accept:** a new item with a photo shows on `/r/[slug]` within the cache window; a restaurant marked closed disappears from the \"open now\" list and `POST /orders` → 422 `restaurant_closed`.\n\n### R2-4. Search, filters, history, ratings\n- Home search (`q` over restaurant names, cuisines, item names — `tsvector`), cuisine chips, veg-only toggle, sort by distance / ETA / rating. `/orders`: past orders with **Reorder** (rebuilds the cart if items still exist). After `delivered`: rate the restaurant and the rider (1–5 + a line) once; averages on cards and the admin.\n- **Accept:** \"dosa\" finds a restaurant by item name only; reorder with one discontinued item explains what was dropped; a second rating → 409.\n\n### R2-5. Refunds, ledgers, payouts\n- Rejection / cancellation of a Razorpay order → automatic refund (`refunds`), event `refunded`. On `delivered`: ledger entries — restaurant `sale` +80 % of the food subtotal, platform `fee` +20 %, rider `delivery` ₹30 + ₹8 per km of the *to_customer* leg, platform `delivery_margin` = delivery fee + platform fee − rider pay (signed, may be negative). `/restaurant/earnings` and `/rider/earnings` show balances and entries; `/admin/payouts` lists balances by account and marks payouts paid with a reference.\n- **Accept (tests):** entries per delivered order sum to the order total; a rejected Razorpay order refunds once; balances are sums; a payout above balance → 422.\n\n---\n\n## v3 — Fleet (advanced, ≈ 8 h)\n\n### R3-1. Batching\n- When a rider is assigned to or heading for restaurant R and another order from R becomes `accepted` whose drop is ≤ 1.5 km from any point of the first order's *to_customer* route (`ST_DWithin` on the route line) and the first is not yet `picked_up`, the second is **stacked** on the same rider (max 2). Pickup covers both; the *to_customer* leg becomes a multi-stop OSRM route (nearest drop first); each order's ETA is its own stop; `delivered` per order. The customer sees \"Your rider has one more drop before yours\" when second.\n- **Accept (tests):** two eligible orders → one rider, one 3-waypoint leg, two correct ETAs; a drop 3 km off the route is not stacked; a third order is not stacked.\n\n### R3-2. Smart ETA\n- `prep_model`: per restaurant, the median and p80 of `accepted → ready` over the last 20 orders (fallback: the restaurant's declared prep time); rider speed = the median of the rider's last 10 legs (fallback 22 km/h). ETA = remaining prep (median) + travel at the rider's speed; the band = [median, p80] shown as \"18–24 min\". Accuracy logged per delivered order (`eta_error_s`) and shown on the admin.\n- **Accept:** on the seeded history the mean absolute ETA error at `accepted` is ≤ 4 min; the band never inverts.\n\n### R3-3. LISTEN / NOTIFY\n- `order_events` and `rider_positions` writes `NOTIFY platter, '{order_id}'` via a trigger; the stream loop holds a direct (non-pooled) asyncpg connection with `LISTEN platter` and wakes on notification instead of sleeping 1 s (a 5-s safety poll stays). Latency (`rider POST → customer event`) is measured by a script on 50 fixes and published in the README.\n- **Accept:** p50 ≤ 300 ms, p95 ≤ 1 s on the measured run; falling back to polling if `LISTEN` fails is automatic and logged.\n\n### R3-4. Heatmap & where to wait\n- `/admin/heatmap`: PostGIS hex grid (`ST_HexagonGrid`, 250 m) over the last 7 days of order drops and pickups, coloured by count, with an hour-of-day slider. The rider app shows a \"busy area\" hint (the top hex for this hour) when idle.\n- **Accept:** hex counts match a SQL check; the hint changes with the hour.\n\n---\n\n## v4 — Order together (unique, free, ≈ 3 h)\n\n### R4-1. The link\n- On the cart, **Order together** → `POST /groups { restaurant_id, address }` → `groups(code, host_user, restaurant, status open|checked_out)` and `/o/{code}`. Anyone opening the link (no account needed; a display name asked once, kept in `localStorage`) sees the same menu and the shared cart; `POST /groups/{code}/items` adds under their name; `DELETE` their own; the host may remove anything. Live over `GET /groups/{code}/events` (the same stream loop over `group_events`). The host checks out (COD or Razorpay) → one `orders` row with `group_id`, items tagged by member; the group becomes `checked_out`.\n- After checkout `/o/{code}` shows the **tracking page** (R5) to every member — the map, the status rail, the rider — with \"your items\" highlighted for the phone that added them; the host's `/orders/[id]` is the same page. The link expires 24 h after delivery.\n- **Accept:** an item added on phone B appears on phone A ≤ 2 s; only the host can check out (403); after checkout both phones stream the same rider; a fresh phone with the link after checkout sees the tracking page read-only.\n\n---\n\n## Out of scope (all versions)\nMulti-city · turn-by-turn navigation · paid maps / routing / realtime / AI · KYC · GST invoices · native apps · multi-restaurant carts · real money · surge pricing · shifts · support tooling · multiple admins · scheduled deliveries (add-on) · tips (add-on) · chat (add-on).\n"}, {"name": "03-user-flows", "path": "docs/03-user-flows.md", "md": "# Platter — User Flows & Screen Index\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-17 · Pairs with [03-requirements.md](03-requirements.md); every screen below gets a mockup in [04-ui-mockups.md](04-ui-mockups.md).\n\n## Flow 1 — Pin to delivered (v1, the main path)\n\n```mermaid\nflowchart LR\n  H[S1 Home · pin + restaurants] --> R[S2 Restaurant · menu]\n  R -->|add items| C[S3 Cart sheet]\n  C --> K[S4 Checkout · address · COD / Razorpay]\n  K -->|COD → placed| T[S5 Tracking · Placed]\n  K -->|Razorpay modal → verify → mark_paid| T\n  T -->|restaurant accepts · rider assigned| T2[S5 Tracking · rider on the map]\n  T2 -->|ready · picked up| T3[S5 Tracking · rider gliding · ETA]\n  T3 -->|delivered| D[S5 Tracking · Delivered → rate in v2]\n  D --> O[S6 Orders · history]\n```\n\n## Flow 2 — The order state machine (v1)\n\n```mermaid\nstateDiagram-v2\n  [*] --> pending_payment: POST /orders (razorpay)\n  [*] --> placed: POST /orders (cod)\n  pending_payment --> placed: verify / webhook → mark_paid()\n  pending_payment --> expired: 15 min, lazy\n  placed --> accepted: restaurant · assign_rider()\n  placed --> rejected: restaurant (reason) · refund v2\n  placed --> cancelled: customer · refund v2\n  accepted --> preparing: restaurant\n  preparing --> ready: restaurant · waiting sim picks up\n  ready --> picked_up: assigned rider / sim · leg to_customer\n  picked_up --> delivered: assigned rider / sim · rider available → next waiting order\n  delivered --> [*]\n  note right of accepted\n    every transition: select … for update ·\n    role check · status check · orders.status ·\n    order_events append (the bus) · else 409\n  end note\n```\n\n## Flow 3 — Live location: rider → bus → customer (v1, the hard part)\n\n```mermaid\nsequenceDiagram\n  participant RP as Rider phone (/rider)\n  participant API as FastAPI\n  participant PG as Postgres (PostGIS)\n  participant CU as Customer (/orders/id)\n  RP->>API: POST /rider/position {lat, lng, heading, speed, at} (every 3 s / ≥ 5 m)\n  API->>PG: upsert rider_positions · insert rider_track\n  CU->>API: GET /orders/{id}/events (EventSource, Last-Event-ID?)\n  API->>PG: order + legs + events since seq · position since pos_ms\n  API-->>CU: event: route {polyline} · event: status · event: rider {lat,lng,heading} · event: eta\n  loop every 1 s until 280 s (v3: on NOTIFY)\n    API->>PG: advance_simulation() · events > seq · position > pos_ms\n    API-->>CU: rider / status / eta events (id: seq:pos_ms) · ping every 15 s\n  end\n  API-->>CU: stream closes at 280 s\n  CU->>API: reconnect with Last-Event-ID (nothing missed — the log is durable)\n```\n\n## Flow 4 — Dispatch (v1 nearest · v2 offers · v3 batching)\n\n```mermaid\nflowchart TD\n  A[restaurant accepts] --> Q{available rider<br/>KNN loc <-> restaurant}\n  Q -->|v1: nearest| AS[assign: rider busy · orders.rider_id · leg to_restaurant via OSRM · event rider_assigned]\n  Q -->|none| W[order waits · rider_id null<br/>tracking shows Finding a rider]\n  W -->|a rider becomes available| AS\n  AS --> ADM[admin reassign → release old · assign new · new leg]\n  subgraph v2 offers\n    Q -->|nearest not yet offered| OF[offer · 30 s countdown on the phone]\n    OF -->|accept| AS\n    OF -->|decline / expiry| Q\n    OF -->|5 riders tried| W\n  end\n  subgraph v3 batching\n    AS -->|second accepted order from the same restaurant<br/>drop ≤ 1.5 km off the route · not yet picked up| ST[stack on the same rider · multi-stop leg]\n  end\n```\n\n## Flow 5 — Simulated rider clock (v1)\n\n```mermaid\nstateDiagram-v2\n  [*] --> available: seed at a junction\n  available --> to_restaurant: assign_rider · leg with OSRM polyline · started_at\n  to_restaurant --> waiting: progress = 1 and order not ready\n  to_restaurant --> to_customer: progress = 1 and order ready → picked_up\n  waiting --> to_customer: restaurant marks ready → picked_up\n  to_customer --> available: progress = 1 → delivered → takes the oldest waiting order\n  note right of to_restaurant\n    position(now) = point along the polyline at\n    min(1, (now − started_at) / duration_s), where a sim's duration_s = distance_m ÷ its speed_kmh;\n    computed in every stream tick and every order read —\n    no process, idempotent under row locks\n  end note\n```\n\n## Flow 6 — Checkout money (v1) and refund (v2)\n\n```mermaid\nsequenceDiagram\n  participant C as Customer\n  participant API as FastAPI\n  participant RZ as Razorpay\n  C->>API: POST /orders/quote {items, address} → totals\n  C->>API: POST /orders {items, address, payment}\n  alt cod\n    API-->>C: order PL-1042 placed\n  else razorpay\n    API->>RZ: order.create(amount)\n    API-->>C: {order_id, razorpay_order_id, key_id}\n    C->>RZ: Standard Checkout modal\n    C->>API: POST /orders/{id}/verify {payment_id, signature}\n    API->>API: mark_paid() → placed (idempotent)\n    RZ->>API: webhook payment.captured → mark_paid() → no-op\n  end\n  Note over API: v2 · rejected / cancelled razorpay → refund once · event refunded\n```\n\n## Flow 7 — Restaurant board and rider app (v1)\n\n```mermaid\nflowchart LR\n  subgraph Board[\"Board · S7\"]\n    N[New · ticket prints + chime] -->|Accept| CK[Cooking]\n    N -->|Reject + reason| X[gone]\n    CK -->|Ready| RD[Ready · rider name + distance]\n    RD -->|rider picked up| OD[Out for delivery]\n  end\n  subgraph Rider[\"Rider · S8\"]\n    J[Job card · to restaurant] -->|arrive| WT[Waiting for ready]\n    WT -->|Picked up| TC[To customer · dark map · route]\n    TC -->|Delivered| NX[Next job / idle]\n  end\n  CK -.->|assign_rider| J\n```\n\n## Flow 8 — Order together (v4)\n\n```mermaid\nflowchart LR\n  A[S3 Cart · Order together] -->|POST /groups| L[\"/o/CODE · shared cart\"]\n  L -->|friend opens on phone B · name once| L2[adds items under their name]\n  L2 -->|group_events over SSE| L\n  L -->|host checks out · one order with group_id| T[\"/o/CODE = S5 Tracking for everyone\"]\n  T -->|your items highlighted per phone| T\n  T -->|24 h after delivered| E[link expired]\n```\n\n## Screen index\n\n| # | Screen | Route | Who | Version | Notes |\n|---|---|---|---|---|---|\n| S1 | Home | `/` | all | v1 · search / filters in v2 | Exists as landing; becomes the pin + restaurants list (map header, address search, cards with distance / ETA / fee) |\n| S2 | Restaurant | `/r/[slug]` | all | v1 | Cover, info strip, menu by category with photos, veg marks, availability, add-to-cart |\n| S3 | Cart | `/r/[slug]` (sheet) | customer | v1 · Order together in v4 | Items, quantities, note, totals preview, Checkout |\n| S4 | Checkout | `/checkout` | customer | v1 | Address (saved / pin), payment COD / Razorpay, quote, Place order; Razorpay modal + dismissed state |\n| S5 | **Tracking** | `/orders/[id]` | customer | v1 · rating in v2 · ETA band in v3 · group view in v4 | **The hero:** map with route, rider marker gliding, trail, ETA, status rail, order summary, cancel while placed |\n| S6 | Orders | `/orders` | customer | v1 · reorder in v2 | History with status chips |\n| S7 | **Restaurant board** | `/restaurant` | restaurant | v1 | Tablet columns New · Cooking · Ready · Out; ticket entrance; accept / reject / preparing / ready; today's totals |\n| S8 | **Rider app** | `/rider` | rider | v1 · offers + online toggle in v2 · busy-area hint in v3 | Phone PWA: job card, dark map with route, Share my location, Picked up / Delivered |\n| S9 | **Admin map** | `/admin` | admin | v1 · heatmap in v3 | Live map of orders + riders, stuck flags, reassign picker, today's numbers |\n| S10 | Sign in / up + demo | `/sign-in`, `/sign-up` | all | v1 | Four demo cards: customer · restaurant · rider · admin |\n| S11 | Addresses | `/addresses` | customer | v1 | Saved addresses with pins; add via search / drag |\n| S12 | Restaurant menu | `/restaurant/menu` | restaurant | v1 (availability) · full editor in v2 | Availability toggles; v2 categories, items, photos, hours |\n| S13 | Earnings + payouts | `/restaurant/earnings`, `/rider/earnings`, `/admin/payouts` | restaurant / rider / admin | v2 | Balances, entries, mark paid |\n| S14 | Heatmap | `/admin/heatmap` | admin | v3 | Hex grid, hour slider |\n| S15 | Order together | `/o/[code]` | anyone with the link | v4 | Shared cart with names → the tracking page after checkout |\n| S16 | States | various | all | v1 | Finding a rider, restaurant closed, too far, cart from another restaurant, payment dismissed, empty history, offline rider |\n"}, {"name": "04-technical-design", "path": "docs/04-technical-design.md", "md": "# Platter — Technical Design\n\n**Lifecycle step:** 4 of 17 · **Locked:** 2026-09-17 · UI companion: [04-ui-mockups.md](04-ui-mockups.md). Schema and routes: [06-data-and-api.md](06-data-and-api.md).\n\n## 1. Stack (shared stack, two additions: PostGIS and the stream loop)\n| Layer | Choice | Notes |\n|---|---|---|\n| web/ | Next.js 15 App Router · TypeScript strict · Tailwind 4 · pnpm | UI only; `/api/*` rewritten to the API so cookies are same-origin and `EventSource` is first-party. New: **`maplibre-gl`** (dynamic import, only on map pages), `polyline` decode in `lib/geo.ts` |\n| api/ | FastAPI (Python 3.12, uv) · SQLAlchemy 2.0 async (asyncpg) + **GeoAlchemy2** + Alembic · pydantic · pytest | Vercel FastAPI preset, `bom1`, `maxDuration` 300. New: `httpx` (OSRM, Photon, Razorpay), `razorpay`, `polyline`, `pywebpush` (v2) |\n| Data | **Neon Postgres + PostGIS** | `create extension postgis` in `0001_v1`; geography columns + GIST; `order_events` is the bus |\n| Realtime | **SSE from FastAPI** (`StreamingResponse`, `text/event-stream`) | One loop in `services/stream.py`; 1-s tick (v3: `LISTEN/NOTIFY`), 280-s lifetime, `Last-Event-ID` replay |\n| Maps | MapLibre GL JS + **OpenFreeMap** (`tiles.openfreemap.org/styles/liberty`) | No key, no quota; a dark style for the rider app derived from `positron` by a script into `web/public/map-dark.json` |\n| Routing | **OSRM public** (`router.project-osrm.org`, `driving`, `overview=full`, `geometries=polyline`) | Once per leg, cached on `rider_legs`; straight line × 1.3 fallback |\n| Geocoding | **Photon** (`photon.komoot.io/api`, `/reverse`, `lang=en`, bbox = Bengaluru) | Called from the browser through `/api/geo/*` (API adds the UA and a 10/min/IP limit) |\n| Files | Vercel Blob | Dish photos, restaurant covers (seed + v2 uploads) |\n| Payments | Razorpay Standard Checkout, test mode | Orders, verify, webhooks; refunds (v2) |\n| Push (v2) | Web Push, VAPID, `pywebpush` | Free; keys generated locally once |\n| Contract | `api/openapi.json` → `openapi-typescript` → `web/src/lib/api-types.ts` | `pnpm gen:api`; committed; not CI-gated |\n| CI | GitHub Actions: `web` (typecheck + build), `api` (ruff + pytest with a `postgis/postgis:17-3.5` service) | That is all |\n\n## 2. Domain model\n- `users(role customer|restaurant|rider|admin)` → `restaurants(owner_user_id unique, slug, name, area, cuisines text[], is_veg, loc geography, address, prep_min, hours jsonb, is_open, cover_url, rating)` → `menu_categories(sort)` → `menu_items(price_paise, is_veg, photo_url, is_available)`; `riders(user_id unique, name, phone, vehicle, is_sim, status offline|available|busy, speed_kmh)`; `rider_positions(rider_id pk, loc, heading, speed_mps, recorded_at)`; `rider_track(order_id, at, loc)`.\n- `addresses(user_id, label, line, loc)`; `orders(number 'PL-####', user, restaurant, address snapshot, rider_id null, status, payment cod|razorpay, subtotal / delivery_fee / platform_fee / total paise, distance_m, eta_s, note, razorpay ids, timestamps per status, group_id (v4))` → `order_items(name, price_paise snapshot, qty, member_name (v4))`; **`order_events(seq bigserial, order_id, kind, actor_role, actor_id, payload jsonb, at)`**; `rider_legs(order_id, rider_id, kind to_restaurant|to_customer, polyline, distance_m, duration_s, started_at, ended_at null, stops jsonb (v3))`.\n- v2: `offers`, `push_subscriptions`, `ratings`, `refunds`, `ledger_entries`, `payouts`; v3: `prep_stats`, `eta_log`; v4: `groups`, `group_items`, `group_events`.\n- Money is integer paise; distances integer metres; every geography column is `SRID 4326` and the web only ever sees `{ lat, lng }`.\n\n## 3. The stream loop (SSE)\n`services/stream.py::stream(scope, since)` is one async generator behind four routes (`/orders/{id}/events`, `/restaurant/events`, `/rider/events`, `/admin/events`, and `/groups/{code}/events` in v4). Per request:\n1. Parse `Last-Event-ID` = `\"{seq}:{pos_ms}\"` (or the query `?since=`); authorise the scope (owner / restaurant / rider / admin / group member).\n2. **Prime:** send `route` events for open legs in scope and, for an order stream, a `status` snapshot — so a fresh page needs no second request.\n3. **Tick** every 1 s (v3: on `NOTIFY`, with a 5-s safety poll): `advance_simulation(scope)`; `select … from order_events where seq > $seq and <scope> order by seq`. **Seq is commit-ordered:** every `order_events` insert first takes `pg_advisory_xact_lock(1)` (always after the row locks a transition already holds, so no lock cycle), which serialises event commits at this scale and guarantees that no event with a lower seq becomes visible after a higher one was read — the cursor never skips; positions `where recorded_at > $pos_ms and rider in <scope>` (sim riders: computed, not read); `eta` recomputed when a status or a position changed; `yield` each as `id: {seq}:{pos_ms}\\nevent: {kind}\\ndata: {json}\\n\\n`. A `: ping` comment every 15 s keeps proxies open.\n4. **Close** at 280 s with a final `event: reconnect`; the browser's `EventSource` reconnects (`retry: 1000`) with the last id. Because every event is a durable row, a reconnect after any outage replays exactly what was missed. Client disconnect (`await request.is_disconnected()`) ends the loop immediately.\n\nResponse headers: `Content-Type: text/event-stream`, `Cache-Control: no-cache, no-transform`, `X-Accel-Buffering: no`. The web `rewrites` `/api/*` → the API host, so the stream is same-origin; Vercel's Python runtime streams `StreamingResponse` bodies as chunks (Fluid compute) — the same design Frontrow locked. Function `maxDuration = 300`.\n\n**Rider positions:** `POST /rider/position { lat, lng, heading, speed_mps, at }` → `rider_positions` upsert with `recorded_at = now()` (server time — the stream cursors and the \"signal weak\" check never trust a phone clock) and `client_at = at` kept only to drop out-of-order fixes from the same phone (`at` older than the stored `client_at` → 204, `X-Ignored: stale`); `rider_track` insert when the rider is on a job; a fix > 200 m from the previous within 3 s is **dropped** as a GPS jump (204, `X-Ignored: jump`, logged) — one rule, used everywhere. Positions are pushed to the order stream of the rider's current order(s), the restaurant stream (distance to the restaurant while *to_restaurant*), and the admin stream (all riders every 2 s).\n\n**Fan-out cost:** each open stream = one function invocation for ≤ 280 s doing one cheap indexed read per second; the tracking page, the board and the admin map are the only long-lived consumers, and the seed runs two live orders — well inside Hobby limits. v3 removes the per-second query.\n\n## 4. Geo\n- **Nearby restaurants:** `select …, ST_Distance(loc, :pin) as dist from restaurants where ST_DWithin(loc, :pin, 8000) order by dist` — those ≤ 5000 m are orderable, 5–8 km are \"Too far\" (shown, greyed). GIST index on `loc`.\n- **Nearest rider:** `select id from riders r join rider_positions p using (rider_id) where r.status = 'available' order by p.loc <-> :restaurant limit 1 for update of r skip locked` — a KNN on the GIST index.\n- **Legs:** `services/routing.py::route(a, b, waypoints=[])` → OSRM `GET /route/v1/driving/{lng,lat;…}?overview=full&geometries=polyline&steps=false` with a 3-s timeout → `{ polyline, distance_m, duration_s }`; on any error → `{ polyline: encode([a, b]), distance_m: haversine × 1.3, duration_s: distance / 22 km/h, method: \"line\" }`. `rider_legs.polyline` is Google-encoded (precision 5); the web decodes with `lib/geo.ts`.\n- **Position along a leg** (`services/sim.py`): decode once, cumulative haversine lengths, `progress = clamp((now − started_at) / duration_s)` where a **sim rider's `duration_s` is `distance_m ÷ (speed_kmh / 3.6)`** (its own speed, set when its leg is created; OSRM's duration is kept only for ETA estimates before assignment), target distance = `progress × total`, interpolate on the segment; heading = bearing of that segment. Pure Python, no shapely.\n- **ETA** (`services/eta.py`): `remaining_prep = max(0, prep_min × 60 − (now − accepted_at))` until `ready`; `travel = remaining_polyline_length / speed` where the remaining length is measured from the projection of the current position onto the leg polyline (nearest vertex + segment projection) and speed = the rider's median speed over the last 60 s, clamped to 12–30 km/h (sims: their fixed speed); before assignment, travel = restaurant → drop leg estimate. `eta_s = remaining_prep + travel (+ 90 s handover)`; `method = osrm | line`. v3 replaces `prep_min` with the learned median and adds the p80 band.\n- **Delivery fee and radius:** the **radius is always straight-line** (`ST_DWithin(restaurant.loc, drop, 5000)`) so the list, the quote and `POST /orders` agree — a restaurant shown as orderable can never 422 `out_of_range` at checkout; `distance_m` for the **fee** = the restaurant → drop OSRM distance at quote time (fallback straight × 1.3), fee = 2500 + 800 × max(0, ceil((distance_m − 2000) / 1000)) paise.\n\n## 5. The order state machine\n`services/orders.py::transition(order_id, to, actor)`:\n```\nbegin; select * from orders where id = $1 for update;\nallowed = TRANSITIONS[(order.status, to)]          -- {roles, guard}\nif actor.role not in allowed.roles or not guard(order, actor): raise 409 illegal_transition {from, to}\nupdate orders set status = to, {to}_at = now();            -- every status has its *_at column (06 §A)\nselect pg_advisory_xact_lock(1); insert order_events (order_id, kind = to, actor_role, actor_id, payload);   -- commit-ordered seq\nside effects in the same transaction: accepted → assign_rider(); ready → sim pickup if waiting; picked_up → new leg;\ndelivered → release_rider() → on_rider_available(); rejected / cancelled → refund (v2) · ledger on delivered (v2)\ncommit\n```\nThe table lives in one dict (`TRANSITIONS`), the guards are one-liners (`restaurant.id == order.restaurant_id`, `rider.id == order.rider_id`, `order.status == 'placed'` for cancel). Sim riders act with `actor = system`. Every transition also emits the push (v2) after commit.\n\n## 6. Dispatch and simulation\n- `assign_rider(order)` (inside the accept transaction): nearest available (§4) → `riders.status = busy`, `orders.rider_id`, `rider_legs(to_restaurant)` from the rider's current position to the restaurant, events `rider_assigned { rider: { name, vehicle } }` and `route { kind, polyline, distance_m, duration_s }`. None → nothing; `on_rider_available(rider)` later picks `select … from orders where rider_id is null and status in ('accepted','preparing','ready') order by accepted_at limit 1 for update skip locked`.\n- **Reassign:** release the old rider (`available`, its leg `ended_at`), assign the chosen one, event `rider_reassigned`; the stream pushes a fresh `route`.\n- **`advance_simulation(scope)`** (`services/sim.py`): for each `is_sim` rider with an open leg in scope: `progress ≥ 1` → *to_restaurant*: if the order is `ready` → `transition(picked_up, system)` (which opens *to_customer*); else mark the leg `arrived_at` and wait (the `ready` transition checks `arrived_at` and picks up immediately); *to_customer* → `transition(delivered, system)`. Every 3 s of wall time the sim's computed position is also upserted into `rider_positions` so admin / board reads agree. Runs under `for update skip locked` so two concurrent streams never double-advance. Speed per sim rider: 22 km/h ± 10 % (`riders.speed_kmh`).\n- **v2 offers:** on accept, `offer(order)` → nearest available rider without an offer for this order → `offers(expires_at = now + 30 s)`, push + stream `offer`; `POST /rider/offers/{id}/accept` (409 if expired / taken) → assign; `/decline` or the tick noticing expiry → the next rider (≤ 5) → else waits, admin flag `no_rider`. Sim riders always accept after 3–8 s (in the tick).\n- **v3 batching:** on accept, before offering, look for a rider assigned to the same restaurant whose first order is not `picked_up` and whose *to_customer* estimate line is `ST_DWithin(new_drop, 1500)` → stack: `orders.rider_id`, `stack_seq = 2`, the *to_customer* leg is (re)routed with two drops (nearest first), `stops jsonb = [{ order_id, eta_s }]`, event `stacked`. Pickup marks both `picked_up`; each drop is its own `delivered`.\n\n## 7. Money\n- **Quote:** `POST /orders/quote { restaurant_id, items: [{ id, qty }], address: { lat, lng } }` → items priced from the DB (unavailable → 422 `item_unavailable { ids }`), `distance_m`, `delivery_fee_paise`, `platform_fee_paise = 500`, `total`. `POST /orders` repeats the quote server-side and never trusts client totals.\n- **Razorpay:** the Skillroom recipe — `orders(pending_payment)` → `order.create` → modal → `POST /orders/{id}/verify` (HMAC) or webhook `payment.captured` → `mark_paid()` under `for update`: `pending_payment → placed`, event `placed`; else no-op; `webhook_events.id` unique. Expiry lazy at 15 min (nothing to release). COD → `placed` directly.\n- **Refund (v2):** `rejected` / `cancelled` on a Razorpay order → `razorpay.payment.refund` once (`refunds` row unique per order) → event `refunded`.\n- **Ledger (v2):** on `delivered` in the same transaction: `sale` +80 % of `subtotal` → `restaurant:{id}`, `fee` +20 % → `platform`, `delivery` 3000 + 800 × km(leg) → `rider:{id}`, `delivery_margin` = `delivery_fee + platform_fee − rider pay` → `platform` (signed). Balances are sums; payouts as Skillroom (request-less: admin pays any positive balance with a reference).\n\n## 8. Web\n- **Rendering:** home and restaurant pages are dynamic with tag caching (`restaurants`, `restaurant:{slug}`), `revalidate: 300`, invalidated on menu changes; the restaurant list itself is fetched client-side for the current pin (`/api/restaurants?lat&lng`). Tracking, board, rider, admin: dynamic `no-store` + `EventSource`.\n- **Map component** (`components/map/Map.tsx`): MapLibre via dynamic import, style from `NEXT_PUBLIC_MAP_STYLE` (liberty) or `/map-dark.json`, a `useRiderMarker` hook that **interpolates** between the last two fixes over their time gap (max 3 s) with `requestAnimationFrame` and rotates a scooter SVG by heading; `useRoute` draws the polyline as a line layer with a **draw-on** animation (line-gradient / `line-dasharray` progress) when a `route` event arrives; trail = a second, thinner line from `rider_track` points received. Reduced motion: marker jumps, route appears.\n- **`useOrderStream(orderId)`** (`lib/stream.ts`): `new EventSource('/api/orders/{id}/events')`, reducers per event kind into `{ status, events[], rider, route, eta }`, `lastEventId` handled by the browser; on `reconnect` nothing to do; on `error` exponential backoff is the browser's; a stale banner if no `ping` for 45 s.\n- **Board** (`app/(restaurant)/restaurant/page.tsx`): columns driven by `useRestaurantStream`; a new `placed` event **prints a ticket** (the signature on this screen) and plays a chime (user-gesture-unlocked once); actions call `POST /restaurant/orders/{id}/transition { to }`.\n- **Rider app** (`app/(rider)/rider/page.tsx`): PWA manifest + minimal SW (app shell), `useGeoUplink` (`watchPosition` → throttle 3 s / 5 m → `POST /rider/position`, `navigator.wakeLock`), the dark map, the job card, two buttons; `useRiderStream` for assignment and status.\n- **Admin map:** all riders + active orders from `useAdminStream`; click an order → the reassign picker (available riders sorted by distance to the restaurant, from `/admin/riders?near=`).\n- **Order together (v4):** `/o/[code]` = the restaurant menu + shared cart from `useGroupStream`; member name in `localStorage`; after checkout the same route renders the tracking view with `member_name` matched to `order_items.member_name`.\n- **Motion signature and visual direction:** decided in [04-ui-mockups.md](04-ui-mockups.md) from the variant page. On the table: *Rider glide*, *Route draw*, *Status rail*, *ETA flip*, *Ticket print*, *Plate slide*, *Radar ping*, *Bell*.\n\n## 9. Auth & access\nOwn session auth as every other project: `users(email citext, password_hash argon2, name, phone, role)`, `sessions`, cookie `pl_session` HttpOnly SameSite=Lax 30 d. `POST /auth/demo { as: customer|restaurant|rider|admin }`. Dependencies `require_user`, `require_restaurant` (loads the owned restaurant; 404 otherwise), `require_rider` (404), `require_admin` (404). Streams authorise once at open; an order stream also re-checks ownership on every reconnect. Group links (v4) are capability URLs (`code` = 10 random base32 chars) — no account needed to add items, the host's session needed to check out.\n\n## 10. Caching & rendering\nRestaurant pages: `s-maxage=300, stale-while-revalidate=600` + web tags. `/restaurants?lat&lng`: `private, max-age=30`. Streams, orders, rider, admin: `no-store`. Blob photos immutable by name. Map tiles cached by the browser (OpenFreeMap sends long max-age). OSRM results cached per leg in the DB (never re-requested for the same leg).\n\n## 11. Failure modes worth handling\n| Failure | Behaviour |\n|---|---|\n| OSRM down / slow (> 3 s) | Straight-line leg, `method = line`, ETA shown as \"≈ 22 min\"; the leg is not retried (a reassign draws a new one) |\n| Photon down | Search shows \"Drop the pin instead\"; the pin still works; reverse label falls back to `lat, lng` |\n| Rider phone loses GPS / goes to background | No fixes → the customer marker stops; after 30 s without a fix (server `recorded_at`) the tracking page shows \"Rider's signal is weak\"; the ETA freezes; the admin flags the rider after 2 min |\n| GPS jump | A fix > 200 m from the previous within 3 s is dropped (204 `X-Ignored: jump`, logged) — the same rule as §3 |\n| Stream hits 280 s / network drop | `EventSource` reconnects with `Last-Event-ID`; the loop replays from the log; no duplicate events (ids are monotonic) |\n| No rider available | Order waits with `rider_id null`; tracking shows \"Finding a rider\"; admin flag after 3 min; the next freed rider takes it |\n| Restaurant never accepts | Admin flag at 5 min; customer can cancel while `placed`; the board's ticket turns red at 3 min |\n| Razorpay modal dismissed | Order stays `pending_payment` 15 min; checkout can re-open the same order; never on the board |\n| Webhook before verify / replayed | `mark_paid` idempotent; `webhook_events.id` unique |\n| Two sims advanced by two streams | `for update skip locked` — one wins, the other reads the result next tick |\n| Vercel cold start on the stream | First event within ~1 s of connect (prime step); the page shows the last known state from the initial `GET /orders/{id}` meanwhile |\n| Push endpoint dead (v2) | 404 / 410 → subscription deleted |\n| `LISTEN` connection refused (v3, pooled URL) | Falls back to the 1-s poll automatically and logs once; the direct Neon URL is a separate env var |\n| Group link after checkout (v4) | Read-only tracking; adding → 409 `checked_out` |\n\n## 12. Testing (only these)\n- `test_transitions`: every allowed row of the table for its actor; every other actor → 409; illegal jumps → 409; concurrent accepts → one event.\n- `test_geo`: three restaurants at known points → correct order and distances; 5 km / 8 km boundaries; nearest-rider KNN picks the right one; `skip locked` under two concurrent assigns never double-books.\n- `test_quote_and_order`: quote == order totals; tampered prices ignored; unavailable item 422; out of range 422 at 5.1 km straight-line while a 4.9 km straight / 6.2 km route address is accepted with the route-based fee; fee at 1.9 / 2.1 / 4.0 km.\n- `test_mark_paid`: verify-then-webhook and webhook-then-verify → one `placed`; replay no-op; expiry at 15 min (fake clock).\n- `test_stream`: an order stream with `Last-Event-ID` replays exactly the missed events; a stranger → 403; positions after `since` only; the 280-s close (fake clock).\n- `test_sim`: a sim rider on a 600-m leg at its `speed_kmh` = 22 (leg `duration_s` = 98) is at the end after 98 s (fake clock); arrival before `ready` waits; `ready` triggers pickup; delivery frees the rider and assigns the waiting order.\n- `test_eta`: projection onto the polyline and remaining length; `method` fallback when OSRM is mocked to fail.\n- v2: `test_offers` (decline → next; expiry; double accept → one), `test_ledger` (entries sum; refund once). v3: `test_batching` (stack / not stack / max 2), `test_prep_model`. v4: `test_group` (host-only checkout; add after checkout 409).\n\n## 13. Environment\n`api/`: `DATABASE_URL` (pooled), `DATABASE_DIRECT_URL` (v3, `LISTEN`), `SESSION_SECRET`, `WEB_URL`, `API_URL`, `REVALIDATE_SECRET`, `BLOB_READ_WRITE_TOKEN`, `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET`, `RAZORPAY_WEBHOOK_SECRET`, `OSRM_URL` (default the public server), `PHOTON_URL`; v2: `VAPID_PUBLIC_KEY`, `VAPID_PRIVATE_KEY`, `VAPID_SUBJECT`. `web/`: `API_URL`, `REVALIDATE_SECRET`, `NEXT_PUBLIC_RAZORPAY_KEY_ID`, `NEXT_PUBLIC_MAP_STYLE`, `NEXT_PUBLIC_BLOB_HOST`; v2: `NEXT_PUBLIC_VAPID_PUBLIC_KEY`.\n"}, {"name": "04-ui-mockups", "path": "docs/04-ui-mockups.md", "md": "# Platter — UI Mockups\n\n**Lifecycle step:** 4 of 17 (UX companion to the technical design) · **Brief locked:** 2026-09-17 · **Variants:** `mockups/direction-variants.html` (twelve directions × six screens, twelve live motion candidates), published at https://claude.ai/artifact/JAekpL7HjR4oU5c39ak7dg · **Chosen: L · Bento** (Viraj, 2026-09-17, from twelve after a second round)\n**Pairs with:** [03-user-flows.md](03-user-flows.md) — one mockup per v1 screen (S1–S12, S16) after the direction is chosen.\n**Files:** `mockups/landing.html` (exists, already ported to `web/`) → `mockups/direction-variants.html` (S1 home + S2 menu on a 390 px phone, **S5 tracking on a phone — the hero**, S7 restaurant board on a tablet, S8 rider on a phone, S9 admin map at desktop, six directions) → `mockups/screens.html` (every v1 screen in the chosen direction) → `mockups/tracker.html` (built by `mockups/tracker-build.py`). Photos: CC from Wikimedia Commons in `mockups/img/`, credits in `mockups/img/CREDITS.md`. Maps: real raster tiles of Koramangala / HSR stitched into `mockups/img/map-light.jpg` and `map-dark.jpg` (artifacts block external tile hosts), with a real OSRM route drawn over them as SVG.\n**Published:** [Direction variants](https://claude.ai/artifact/JAekpL7HjR4oU5c39ak7dg) · [Screens](https://claude.ai/artifact/GGchE2CjZ7DN5t83pzs9Cu) · [Tracker](https://claude.ai/artifact/HEHpyrigHuZpBMoECDs4qG).\n\n## Brief\n**Style:** the landing set a first identity — **Bricolage Grotesque**, cream `#FFF6E9`, green `#2F7D4A`, tomato `#E4402E`, butter `#FFD166`, 16 px radius — warm and appetising. It is one candidate (A), not the answer. Delivery apps live or die on **the tracking page** (does the rider feel real? does the ETA feel honest?) and **the menu** (does the food look worth ordering at 9 pm?) — plus two screens only this project has: **the restaurant board** on a tablet in a hot kitchen (big, loud, one-tap) and **the rider app** on a phone in a handlebar mount (dark, huge buttons, glanceable). The variants must be genuinely different UI styles (layout DNA, type, surface, density), not chrome swaps of one system; the admin is the same system at a denser, calmer setting.\n\n**The product is the map and the food.** On the tracking page the map is the biggest thing; on the menu the photos are. Chrome is type and rules. The rider phone is dark in every direction (a screen in sunlight and at night); everything else is free. Board is a tablet in landscape; admin is desktop.\n\n**Real content:** the seed — 12 restaurants around Koramangala / HSR (Dosa Camp, Biryani Bhatti, Koramangala Social, Momo Junction, Thali Ghar, Chai Point…), ~100 dishes with CC photos, prices in ₹ (₹40 filter coffee to ₹420 biryani), a live order `PL-1042` with a sim rider (Suresh · scooter) 6 minutes away, a board with four tickets, an admin map with 9 riders.\n\n## Motion candidates — live in the variant page\n| Candidate | What happens | Reduced-motion fallback |\n|---|---|---|\n| **1 · Rider glide** | The rider marker (a scooter) eases between GPS fixes over their 3-s gap with a heading rotation; a thin trail draws behind it; the ETA badge nudges when it changes | Marker jumps; no trail animation |\n| **2 · Route draw** | When a route arrives, the polyline draws itself from the restaurant to the pin (dashoffset, 900 ms) and the pin drops with a bounce | Route appears |\n| **3 · Status rail** | The order steps Placed → Accepted → Cooking → Ready → Picked up → Delivered light along a rail as events arrive; the current step breathes; Cooking has a steam wisp | Steps set to their state |\n| **4 · ETA flip** | Minutes flip like a split-flap board when the ETA changes (top half falls, bottom half rises); \"≈\" appears when the method is a straight line | Number changes |\n| **5 · Ticket print** | On the board, a new order feeds out of a slot at the top of the New column as a KOT ticket with a perforated edge (translateY, 700 ms) and a chime; a tear-off when accepted | Ticket appears |\n| **6 · Plate slide** | Add to cart: the dish photo scales down and slides onto the cart bar at the bottom, which bumps and counts up | Count changes |\n| **7 · Radar ping** | On accept, a ring sweeps out from the restaurant on the customer map until it touches the nearest rider, then locks with a click | \"Finding a rider\" text only |\n| **8 · Bell** | The board's bell icon swings and the ticket count pops when a new order lands; the tablet title shows \"(1) New order\" | Count changes |\n\nRecommendation: **1 · Rider glide + 2 · Route draw** as the signature (the wow moment is the marker moving on real streets) + **5 · Ticket print** on the board + one catalogue touch (**6**) per direction.\n\n## Variant page (`mockups/direction-variants.html`) — six directions, six screens each\nEach tab: **S5 tracking** on a 390 px phone (the hero, with the live marker) beside **S1 home** and **S2 menu** on phones; **S7 restaurant board** on a 1024 px tablet; **S8 rider** on a phone (dark map); **S9 admin map** at desktop 1280 (scaled); then a strip with the eight motion candidates live in that direction's idiom. Keys 1–6 switch tabs; every direction carries the same photos, the same map and the same copy.\n\n| Direction | Style (layout DNA · surface · type) | Demonstrates |\n|---|---|---|\n| **A · Menu card** | The landing's diner system: cream, green, tomato, butter; Bricolage Grotesque; 16 px radius; soft cards; bottom cart bar; map with a rounded sheet over it | Rider glide + Plate slide |\n| **B · Night kitchen** | Near-black with warm amber and chilli red; Sora headings; the dark map is the page on every screen; full-bleed dish photos with gradients; horizontal rails; the tracking sheet is a glass panel | Route draw + ETA flip |\n| **C · Dabba** | Tiffin steel and kraft paper: warm grey-brown, brass, a stamped label red; Fraunces headings + IBM Plex Sans; stacked-tin sections with rivets, kraft tags for prices, rubber stamps for status; the board is a kitchen slip rail | Ticket print + Status rail |\n| **D · Dispatch** | Control-room: graphite and signal green, Space Grotesk + JetBrains Mono, telemetry chips (speed, heading, fixes), the map with a grid and range rings; dense; the rail is a timeline with timestamps | Radar ping + Rider glide |\n| **E · Newsprint** | Editorial menu: off-white, ink, one tomato accent; Instrument Serif at 64 px, numbered dishes with dotted leaders, thin rules, a two-column menu like a printed card; the map in a bordered plate | Status rail + Plate slide |\n| **F · Poster** | Swiss bold: saffron, leaf, chilli, off-white; Archivo Black / Archivo; giant type, flat colour blocks, no radius, black hairlines; the ETA is the poster headline; the board is a departures board | ETA flip + Bell |\n\n`prefers-reduced-motion` respected in all.\n\n## Round two (2026-09-17)\nViraj asked for \"something else\" after A–F; six more directions were added on the same page (**G · Glass** frosted panels over a full-bleed map · **H · Zine** hand-drawn street-food comic · **I · Receipt** thermal-printer monochrome · **J · Neon** night market · **K · Atlas** folded paper map · **L · Bento** pastel tiles) plus four more motion candidates (**9 · Steam** wisps over the dish while cooking · **10 · Handover** the bag hops from the scooter to the door and a tick lands · **11 · Accuracy ring** the drop pin's GPS ring tightens as fixes improve · **12 · Counter roll** totals roll digit by digit). He picked **L**.\n\n## Chosen direction — L · Bento (locked 2026-09-17)\n**Idea:** every screen is a bento box — a grid of chunky rounded tiles in five pastels, each tile one thing (the map, the ETA, the rider, the steps, the bill). Nunito at weight 900 for anything that matters, 700 for everything else; emoji-scale icons instead of an icon set where a glyph is enough; nothing has a border — surfaces are separated by colour and a soft two-layer shadow. The map is simply the biggest tile. Tiles pop in with a spring and reflow when the order's state changes, so the page itself is the status: the ETA tile grows when the rider is close, the steps tile turns mint at delivered. The board is four pastel columns of white tickets; the rider app is the same tiles on ink; the admin is three stat tiles, a big map tile and a ledger tile.\n\n### Tokens (→ `web/src/app/globals.css`)\n| Token | Value | Use |\n|---|---|---|\n| `--bg` | `#F3F0FF` | page ground (lavender-white) |\n| `--tile` | `#FFFFFF` | default tile |\n| `--lav` / `--mint` / `--peach` / `--lemon` / `--sky` | `#E6DEFF` / `#D9F5E3` / `#FFE1D1` / `#FFF1B8` / `#D8EDFF` | the five pastels: lav = info / steps done, mint = good / delivered / ETA, peach = attention / stuck / new order, lemon = rider / money, sky = restaurant / cooking |\n| `--ink` / `--ink2` / `--muted` | `#1F1B2E` / `#3B3552` / `#8D87A3` | text / secondary / labels (≥ 4.5:1 on every pastel) |\n| `--violet` | `#7B5CFF` | primary action, the route, current chip |\n| `--coral` | `#FF7A59` | the rider marker, alerts, reject, the current step |\n| `--green` | `#2ECC71` | live dot, share-location toggle, available riders |\n| `--ink-tile` | `#1F1B2E` · text `#F3F0FF` | dark tiles (rider app ground, cart bar, nav on dark) |\n| radii | tile 24 px · inner card 18 px · chip 14 px · pill 999 · phone 44 | nothing square; images always inside a tile radius |\n| shadow | `0 2px 0 rgba(31,27,46,.05), 0 10px 24px rgba(31,27,46,.06)` | every tile; `0 0 0 3px var(--coral)` for a fresh ticket |\n| type | **Nunito** 900 (titles, numbers, buttons) · 800 (labels) · 700 (body 13–14 px) · tabular numerals for ₹, km, min | `next/font/google`, `display: swap`; no second family |\n| grid | phone: 2 columns, 10 px gap, 12 px gutter; tablet board: 4 columns; admin: `1fr 1fr 1fr 460px` with the map spanning three | tiles are `grid-template-rows` sized, never fixed heights inside |\n| map | MapLibre `liberty` inside a tile; dark tile uses `map-dark.json`; route `--violet` 7 px with a white casing, trail `--coral`, restaurant pin ink, drop pin violet, rider marker coral scooter | |\n\n### Motion (all with `prefers-reduced-motion` fallbacks)\n| Moment | Spec | Reduced |\n|---|---|---|\n| **Rider glide + Route draw (signature, S5 / S8 / S9)** | the marker interpolates between fixes over their gap with rAF and rotates to heading; a coral trail follows; when a `route` event lands the violet polyline draws itself (dashoffset, 900 ms, `cubic-bezier(.2,.8,.2,1)`) and the drop pin drops with a spring (`.34,1.56,.64,1`) | marker jumps; route appears; pin static |\n| **Tile spring (every screen)** | tiles enter with a 60 ms stagger: `scale(.92) translateY(8px)` → identity, 420 ms spring; on a status change the affected tile re-springs and swaps colour (ETA tile → mint at ≤ 3 min, steps tile → mint at delivered, rider tile → lemon when assigned) | tiles appear; colours swap instantly |\n| Ticket print (S7) | a new order feeds out of the top of the New column as a white ticket (translateY, 700 ms), the column tile pulses peach once, a chime plays (user-gesture-unlocked); Accept slides the ticket to Cooking with a `view-transition` | ticket appears; column colour swaps |\n| Plate slide (S2 / S3) | Add: the dish photo shrinks and slides into the cart bar, which bumps (`translateY(-8px) scale(1.03)`, 500 ms spring) and rolls its count | count changes |\n| ETA roll (S5) | minutes change with the Counter roll (digits slide vertically, 500 ms) | number changes |\n| Steam (S5 while cooking, S7 Cooking column) | three blurred wisps rise from the dish / the ticket header on a 2.2-s loop | none |\n| Handover (S5 at delivered) | the coral bag hops from the scooter to the door tile and a mint tick lands; the steps tile turns mint | tick appears |\n| Accuracy ring (S1 / S4 pin) | the pin's GPS ring breathes and tightens as `accuracy` improves | static ring |\n| Radar ping (S5 on accept) | two rings sweep from the restaurant tile's map until the nearest rider locks | \"Finding a rider\" chip only |\n| Bell (S7) | the bell swings and the New count pops on a new order; the tab title shows \"(1) New order\" | count changes |\n\n### Browser surfaces\n`::selection` lavender with ink · scrollbar: bg track, lavender thumb 10 px rounded · focus ring 3 px `--violet`, offset 2 px · `caret-color` violet · `theme-color` `#F3F0FF` (light) / `#1F1B2E` (rider app) · favicon = the mark on a lavender rounded tile.\n\n## Screens (`mockups/screens.html`)\nEvery v1 screen from the screen index in Bento plus S16 states: S1 home (desktop + phone), S2 restaurant, S3 cart sheet, S4 checkout (+ Razorpay modal dismissed), S5 tracking (phone, the resume of the wow moment; desktop), S6 orders, S7 restaurant board (tablet), S8 rider app (phone, before and after *Share my location*), S9 admin map (desktop), S10 sign in with the four demo cards, S11 addresses, S12 restaurant menu availability, S16 states (finding a rider, restaurant closed, too far, cart from another restaurant, payment dismissed, empty orders, rider offline / weak signal). Published at https://claude.ai/artifact/GGchE2CjZ7DN5t83pzs9Cu. **Step 4 complete.**\n"}, {"name": "05-architecture", "path": "docs/05-architecture.md", "md": "# Platter — Architecture\n\n**Lifecycle step:** 5 of 17 · **Locked:** 2026-09-17\n\n## 1. System diagram\n\n```mermaid\nflowchart LR\n  subgraph Browsers\n    CU[\"Customer · phone / laptop<br/>pin · menu · checkout · tracking (EventSource)\"]\n    RB[\"Restaurant board · tablet<br/>tickets · accept / ready (EventSource)\"]\n    RD[\"Rider · phone PWA<br/>watchPosition → POST · job · buttons (EventSource)\"]\n    AD[\"Admin · desktop<br/>live map · reassign (EventSource)\"]\n  end\n  subgraph Vercel\n    WEB[web · platter<br/>Next.js: pages · MapLibre · rewrites /api/* →]\n    API[api · platter-api<br/>FastAPI bom1 · maxDuration 300<br/>REST · state machine · dispatch · sim · stream loop · webhooks]\n  end\n  PG[(\"Neon Postgres + PostGIS<br/>users · restaurants · menu · orders · order_events (bus)<br/>riders · rider_positions · rider_track · rider_legs\")]\n  BL[Vercel Blob<br/>dish photos · covers]\n  OFM[OpenFreeMap tiles]\n  OSRM[OSRM public router]\n  PH[Photon geocoder]\n  RZ[Razorpay]\n  WP[Web Push · v2]\n\n  CU & RB & RD & AD -->|same-origin /api/*| WEB --> API\n  CU & RB & RD & AD -->|vector tiles| OFM\n  API --> PG\n  API -->|route per leg| OSRM\n  API
