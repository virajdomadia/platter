[project]
name = "platter-api"
version = "1.0.0"
description = "Platter API — FastAPI backend (see docs/04-technical-design.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "geoalchemy2>=0.17",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "email-validator>=2.2",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "uvicorn[standard]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# point_sql() only interpolates a fixed column-name prefix, never data.
"app/seed/**" = ["S311", "S608"]
"app/services/demo.py" = ["S311"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
